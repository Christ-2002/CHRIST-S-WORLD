<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - CHRIST'S WORLD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%232f5d3a'/%3E%3Crect x='4.2' y='6.6' width='1.5' height='3.4' fill='%239bca4b'/%3E%3Crect x='3.2' y='7.6' width='3.5' height='1.4' fill='%239bca4b'/%3E%3Ccircle cx='10.6' cy='8' r='0.85' fill='%23e2503d'/%3E%3Ccircle cx='12.2' cy='9.8' r='0.85' fill='%23f0b429'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ================= 顶部导航 ================= -->
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        <span>CHRIST'S WORLD</span>
      </a>
      <nav class="nav-links">
        <a class="nav-link" href="../index.html">首页</a>
        <a class="nav-link" href="games.html">游戏</a>
        <a class="nav-link current" id="userLink">用户</a>
      </nav>
    </div>
  </header>

  <!-- ================= 登录区 ================= -->
  <div class="container page-head">
    <a class="back-link" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
      返回首页
    </a>
  </div>

  <section class="auth-wrap">
    <div class="auth-shell">
      <div class="auth-head">
        <span class="auth-logo">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M2 8.2Q2 5.2 5 5.2h6q3 0 3 3v.8q0 2.8-2.4 2.8q-1.4 0-1.6-1.4H6Q5.8 11.8 4.4 11.8Q2 11.8 2 9Z" fill="#1f2d20"/>
            <rect x="4.3" y="6.8" width="1.4" height="3" fill="#9bca4b"/>
            <rect x="3.5" y="7.6" width="3" height="1.4" fill="#9bca4b"/>
            <circle cx="10.5" cy="7.9" r="0.8" fill="#e2503d"/>
            <circle cx="12" cy="9.5" r="0.8" fill="#f0b429"/>
          </svg>
        </span>
        <h1 class="auth-title">登录</h1>
        <p class="auth-sub">LOGIN TO CONTINUE</p>
      </div>

      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field-label">用户名</span>
          <input class="input" type="text" id="username" placeholder="请输入用户名" autocomplete="username">
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input class="input" type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
        </label>
        <p class="auth-error" id="authError" hidden></p>
        <button class="pixel-btn auth-btn" type="submit">登 录</button>
      </form>

      <p class="auth-foot">还没有账号？<a href="javascript:;">随便填一个就能进入</a>（本站为演示登录）</p>
    </div>
  </section>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <span class="brand-mark" style="width:22px;height:22px;box-shadow:none;">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        CHRIST'S WORLD
      </span>
    </div>
  </footer>

  <script src="../js/common.js"></script>
  <script>
    // 登录表单：演示登录，写入登录态后跳转到用户页
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('loginForm');
      var err = document.getElementById('authError');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        if (!username || !password) {
          err.hidden = false;
          err.textContent = '用户名和密码不能为空';
          return;
        }

        err.hidden = true;
        // 与 index.html 的登录检测保持一致
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('site-user', username);
        location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
