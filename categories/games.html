<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你爹的网站</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%232f5d3a'/%3E%3Crect x='4.2' y='6.6' width='1.5' height='3.4' fill='%239bca4b'/%3E%3Crect x='3.2' y='7.6' width='3.5' height='1.4' fill='%239bca4b'/%3E%3Ccircle cx='10.6' cy='8' r='0.85' fill='%23e2503d'/%3E%3Ccircle cx='12.2' cy='9.8' r='0.85' fill='%23f0b429'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ================= 顶部导航 ================= -->
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        <span>CHRIST'S WORLD</span>
      </a>
      <nav class="nav-links">
        <a class="nav-link" href="../index.html">首页</a>
        <a class="nav-link current" href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <!-- ================= 页头（左侧标题 / 右上角奖牌榜） ================= -->
  <div class="container page-head games-head">
    <div>
      <a class="back-link" href="../index.html">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        返回首页
      </a>
      <h1 class="page-title" style="margin-top:16px;">游戏</h1>
    </div>

    <!-- 奖牌榜：数字由 js/common.js 的 SiteMedals.renderBoard() 自动填充 -->
    <div class="medal-board" id="medalBoard" aria-label="奖牌榜">
      <span class="board-label">奖牌榜<br>MEDALS</span>
      <div class="medal-counters">
        <span class="medal-item" title="金牌">
          <svg viewBox="0 0 48 56" class="medal-svg" aria-hidden="true">
            <path d="M19 3 L11 27 L20.5 22 Z" fill="#35659c"/>
            <path d="M29 3 L37 27 L27.5 22 Z" fill="#2a5280"/>
            <circle cx="24" cy="35" r="14" fill="#f0b429" stroke="#1f2d20" stroke-width="3"/>
            <circle cx="24" cy="35" r="9.5" fill="none" stroke="#1f2d20" stroke-width="1.6" opacity=".35"/>
            <path d="M24 28.5 L25.35 32.2 L29.3 32.4 L26.2 34.9 L27.2 38.8 L24 36.7 L20.8 38.8 L21.8 34.9 L18.7 32.4 L22.65 32.2 Z" fill="#ffffff"/>
          </svg>
          <b id="cntGold">0</b>
        </span>
        <span class="medal-item" title="银牌">
          <svg viewBox="0 0 48 56" class="medal-svg" aria-hidden="true">
            <path d="M19 3 L11 27 L20.5 22 Z" fill="#35659c"/>
            <path d="M29 3 L37 27 L27.5 22 Z" fill="#2a5280"/>
            <circle cx="24" cy="35" r="14" fill="#c3c9d2" stroke="#1f2d20" stroke-width="3"/>
            <circle cx="24" cy="35" r="9.5" fill="none" stroke="#1f2d20" stroke-width="1.6" opacity=".35"/>
            <path d="M24 28.5 L25.35 32.2 L29.3 32.4 L26.2 34.9 L27.2 38.8 L24 36.7 L20.8 38.8 L21.8 34.9 L18.7 32.4 L22.65 32.2 Z" fill="#ffffff"/>
          </svg>
          <b id="cntSilver">0</b>
        </span>
        <span class="medal-item" title="铜牌">
          <svg viewBox="0 0 48 56" class="medal-svg" aria-hidden="true">
            <path d="M19 3 L11 27 L20.5 22 Z" fill="#35659c"/>
            <path d="M29 3 L37 27 L27.5 22 Z" fill="#2a5280"/>
            <circle cx="24" cy="35" r="14" fill="#d98b46" stroke="#1f2d20" stroke-width="3"/>
            <circle cx="24" cy="35" r="9.5" fill="none" stroke="#1f2d20" stroke-width="1.6" opacity=".35"/>
            <path d="M24 28.5 L25.35 32.2 L29.3 32.4 L26.2 34.9 L27.2 38.8 L24 36.7 L20.8 38.8 L21.8 34.9 L18.7 32.4 L22.65 32.2 Z" fill="#ffffff"/>
          </svg>
          <b id="cntBronze">0</b>
        </span>
      </div>
    </div>
  </div>

  <!-- ================= 游戏列表 ================= -->
  <section class="section" style="padding-top:18px;">
    <div class="container">
      <div class="card-grid">

        <!-- 游戏 1：贪吃蛇（可玩） -->
        <a class="pixel-card" href="../games/snake.html">
          <div class="card-cover snake">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <!-- 网格线 -->
              <g stroke="#9bbd6c" stroke-width="0.35">
                <line x1="0" y1="4" x2="16" y2="4"/>
                <line x1="0" y1="8" x2="16" y2="8"/>
                <line x1="0" y1="12" x2="16" y2="12"/>
                <line x1="4" y1="0" x2="4" y2="16"/>
                <line x1="8" y1="0" x2="8" y2="16"/>
                <line x1="12" y1="0" x2="12" y2="16"/>
              </g>
              <!-- 蛇身 -->
              <g fill="#2f5d3a">
                <rect x="2" y="7" width="2" height="2"/>
                <rect x="4" y="7" width="2" height="2"/>
                <rect x="6" y="7" width="2" height="2"/>
                <rect x="8" y="7" width="2" height="2"/>
                <rect x="8" y="5" width="2" height="2"/>
                <rect x="10" y="5" width="2" height="2"/>
              </g>
              <!-- 蛇头 + 眼睛 -->
              <rect x="12" y="5" width="2" height="2" fill="#1f2d20"/>
              <rect x="13.1" y="5.4" width="0.5" height="0.5" fill="#ffffff"/>
              <!-- 食物 -->
              <rect x="12" y="11" width="2" height="2" fill="#e2503d"/>
              <rect x="12.6" y="10.5" width="0.5" height="0.6" fill="#2f5d3a"/>
            </svg>
          </div>
          <div class="card-body">
            <h3 class="card-title">01 · 贪吃蛇<span class="card-medal" id="cardMedalSnake"></span></h3>
            <div class="card-meta">
              <span class="badge">可游玩</span>
              <span class="card-go">PLAY &gt;</span>
            </div>
          </div>
        </a>

        <!-- 游戏 2：仿马里奥（可玩） -->
        <a class="pixel-card" href="../games/mario.html">
          <div class="card-cover mario">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <!-- 云 -->
              <g fill="#ffffff">
                <rect x="1.6" y="3" width="4.8" height="1.5"/>
                <rect x="2.4" y="2.2" width="1.8" height="0.9"/>
                <rect x="4" y="2.5" width="1.5" height="0.6"/>
              </g>
              <!-- 问号砖块 -->
              <rect x="6" y="5.6" width="4.4" height="4.4" fill="#f0b429" stroke="#1f2d20" stroke-width="0.5"/>
              <path d="M7.5 6.9q0-.7 1-.7t1 .7q0 .5-.7.8l-.3.4v.6" stroke="#ffffff" stroke-width="0.75" fill="none" stroke-linecap="square"/>
              <rect x="8.05" y="9.25" width="0.7" height="0.7" fill="#ffffff"/>
              <!-- 地面砖块 -->
              <rect x="0" y="13" width="16" height="3" fill="#d98b46"/>
              <g stroke="#1f2d20" stroke-width="0.4">
                <line x1="0" y1="14.5" x2="16" y2="14.5"/>
                <line x1="4" y1="13" x2="4" y2="14.5"/>
                <line x1="8" y1="13" x2="8" y2="14.5"/>
                <line x1="12" y1="13" x2="12" y2="14.5"/>
                <line x1="2" y1="14.5" x2="2" y2="16"/>
                <line x1="6" y1="14.5" x2="6" y2="16"/>
                <line x1="10" y1="14.5" x2="10" y2="16"/>
                <line x1="14" y1="14.5" x2="14" y2="16"/>
              </g>
            </svg>
          </div>
          <div class="card-body">
            <h3 class="card-title">02 · 仿马里奥<span class="card-medal" id="cardMedalMario"></span></h3>
            <div class="card-meta">
              <span class="badge">可游玩</span>
              <span class="card-go">PLAY &gt;</span>
            </div>
          </div>
        </a>

        <!-- 游戏 3：井字棋（可玩） -->
        <a class="pixel-card" href="../games/tictactoe.html">
          <div class="card-cover ttt">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <!-- 井字格 -->
              <g stroke="#1f2d20" stroke-width="0.55">
                <line x1="5.33" y1="0.6" x2="5.33" y2="15.4"/>
                <line x1="10.67" y1="0.6" x2="10.67" y2="15.4"/>
                <line x1="0.6" y1="5.33" x2="15.4" y2="5.33"/>
                <line x1="0.6" y1="10.67" x2="15.4" y2="10.67"/>
              </g>
              <!-- 左上 O -->
              <circle cx="2.67" cy="2.67" r="1.45" fill="none" stroke="#e2503d" stroke-width="1"/>
              <!-- 中间 X -->
              <g stroke="#2f5d3a" stroke-width="1.15">
                <line x1="6.9" y1="6.9" x2="9.1" y2="9.1"/>
                <line x1="9.1" y1="6.9" x2="6.9" y2="9.1"/>
              </g>
              <!-- 右下 O -->
              <circle cx="13.33" cy="13.33" r="1.45" fill="none" stroke="#e2503d" stroke-width="1"/>
            </svg>
          </div>
          <div class="card-body">
            <h3 class="card-title">03 · 井字棋<span class="card-medal" id="cardMedalTictactoe"></span></h3>
            <div class="card-meta">
              <span class="badge">可游玩</span>
              <span class="card-go">PLAY &gt;</span>
            </div>
          </div>
        </a>

        <!-- 游戏 4：对战消消乐（可玩） -->
        <a class="pixel-card" href="../games/battlematch.html">
          <div class="card-cover battle">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <!-- 四色宝石 -->
              <rect x="8.2" y="1.3" width="2.7" height="2.7" fill="#5a8f3c" stroke="#1f2d20" stroke-width="0.35"/>
              <rect x="11.3" y="1.3" width="2.7" height="2.7" fill="#e2503d" stroke="#1f2d20" stroke-width="0.35"/>
              <rect x="8.2" y="4.4" width="2.7" height="2.7" fill="#f0b429" stroke="#1f2d20" stroke-width="0.35"/>
              <rect x="11.3" y="4.4" width="2.7" height="2.7" fill="#3a6ea5" stroke="#1f2d20" stroke-width="0.35"/>
              <rect x="8.7" y="1.8" width="0.8" height="0.8" fill="rgba(255,255,255,.5)"/>
              <rect x="11.8" y="1.8" width="0.8" height="0.8" fill="rgba(255,255,255,.5)"/>
              <!-- 剑 -->
              <line x1="3.1" y1="13.1" x2="7.6" y2="6.4" stroke="#d8d8d0" stroke-width="1.5" stroke-linecap="square"/>
              <line x1="2.1" y1="11.7" x2="4.7" y2="12.9" stroke="#8a6a3a" stroke-width="1.4" stroke-linecap="square"/>
              <line x1="1.7" y1="12.7" x2="2.7" y2="13.9" stroke="#3a78c2" stroke-width="1.6" stroke-linecap="square"/>
            </svg>
          </div>
          <div class="card-body">
            <h3 class="card-title">04 · 对战消消乐<span class="card-medal" id="cardMedalBattlematch"></span></h3>
            <div class="card-meta">
              <span class="badge">可游玩</span>
              <span class="card-go">PLAY &gt;</span>
            </div>
          </div>
        </a>

        <!-- 游戏 5：张雪峰快跑（可玩） -->
        <a class="pixel-card" href="../games/run.html">
          <div class="card-cover run">
            <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
              <!-- 地面 -->
              <rect x="0" y="12.6" width="16" height="3.4" fill="#5a8f3c"/>
              <rect x="0" y="12.6" width="16" height="1" fill="#6ea347"/>
              <!-- 追赶的心脏 -->
              <g fill="#e23b3b">
                <rect x="1.6" y="5.8" width="1.4" height="1.4"/>
                <rect x="3" y="5" width="1.6" height="1.6"/>
                <rect x="4.6" y="5" width="1.6" height="1.6"/>
                <rect x="6" y="5.8" width="1.4" height="1.4"/>
                <rect x="2.2" y="6.8" width="4.6" height="1.6"/>
                <rect x="2.8" y="8.4" width="3.4" height="1.4"/>
                <rect x="3.6" y="9.8" width="1.8" height="1.2"/>
                <rect x="4.2" y="11" width="0.9" height="1"/>
              </g>
              <!-- 速度线 -->
              <rect x="7.4" y="6.2" width="1.6" height="0.7" fill="#1f2d20"/>
              <rect x="7" y="7.8" width="1.2" height="0.7" fill="#1f2d20"/>
              <!-- 奔跑的张雪峰（朝右） -->
              <rect x="10.6" y="2.8" width="2.4" height="2.4" fill="#e9bb91"/>
              <rect x="10.4" y="2.4" width="2.8" height="1.1" fill="#1d1b1a"/>
              <rect x="10.8" y="3.5" width="0.8" height="0.8" fill="#141414"/>
              <rect x="12" y="3.5" width="0.8" height="0.8" fill="#141414"/>
              <rect x="10.3" y="5.2" width="3" height="3" fill="#33425c"/>
              <rect x="11.5" y="5.3" width="0.7" height="2.4" fill="#c0392b"/>
              <rect x="13" y="5.4" width="0.9" height="2" fill="#33425c"/>
              <rect x="10.2" y="8.4" width="1" height="2.6" fill="#2e3440"/>
              <rect x="12.4" y="8.2" width="1" height="2.8" fill="#2e3440"/>
              <rect x="9.8" y="10.8" width="1.7" height="0.9" fill="#191c22"/>
              <rect x="12.2" y="10.8" width="1.8" height="0.9" fill="#191c22"/>
            </svg>
          </div>
          <div class="card-body">
            <h3 class="card-title">05 · 张雪峰快跑</h3>
            <div class="card-meta">
              <span class="badge">可游玩</span>
              <span class="card-go">PLAY &gt;</span>
            </div>
          </div>
        </a>

        <!--
          ===== 添加新游戏的模板（复制上面任意一张 <a class="pixel-card">…</a> 改一改即可）=====
          1. 在 ../games/ 文件夹里新建一个 html（可以复制 snake.html 改）
          2. 把卡片里的链接、标题、简介、封面 SVG 换掉
          3. 卡片默认一行 3 个；超过 3 个会自动换行
        -->

      </div>
    </div>
  </section>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <span class="brand-mark" style="width:22px;height:22px;box-shadow:none;">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        CHRIST'S WORLD
      </span>
    </div>
  </footer>

  <script src="../js/common.js"></script>
</body>
</html>
