          </span>

            <svg class="icon"><use href="#i-search"/></svg>

            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn icon-btn-bell" id="notificationBtn" type="button" aria-label="风险提醒">

            <span class="notify-dot" id="notifyDot" hidden></span>
          </button>

          </a>
          <span class="avatar" title="个人工作台"><svg class="icon"><use href="#i-user"/></svg></span>
        </div>
      </header>

        <div class="page-loading">

        <span class="footer-version">v1.0.0</span>
