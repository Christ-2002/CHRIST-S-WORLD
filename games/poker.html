<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>魔兽扑克 · WARCRAFT POKER</title>
<style>
  :root{
    --ink:#10151a; --dark:#1c3a2a; --mid:#2f6b3f; --light:#7ec850;
    --paper:#f4ecd6; --paper2:#e7dcc2; --bg:#0c2116; --panel:#143322; --panel2:#1d452e;
    --red:#e2503d; --gold:#f0b429; --blue:#4aa3df; --purple:#b56ce0;
    --bd:3px solid var(--ink);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; min-width:1024px; min-height:620px;}
  body{
    background:var(--bg); color:var(--paper); overflow:hidden;
    font-family:"Microsoft YaHei","Consolas",monospace,sans-serif;
  }
  button{font-family:inherit; cursor:pointer;}
  img,canvas{image-rendering:pixelated;}

  /* ============ 总布局：6列 × 2行 ============ */
  #screen{position:fixed; inset:0;
    display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:0.92fr 1.22fr;
    gap:8px; padding:8px;}
  .box{background:transparent; border:none; border-radius:0; position:relative;
    box-shadow:none; overflow:visible;}
  #battle{grid-column:1/4; grid-row:1;}
  #aiArea{grid-column:4/7; grid-row:1;}
  #pArea{grid-column:1/5; grid-row:2;}
  #pileArea{grid-column:5/7; grid-row:2;}

  .boxhead{height:26px; background:var(--panel2); border-bottom:2px solid var(--ink);
    display:flex; align-items:center; padding:0 10px; font-size:12px; font-weight:bold;
    color:#a7d8b0; letter-spacing:1px; flex:none;}
  .boxbody{position:absolute; top:0; left:0; right:0; bottom:0; padding:6px;}

  /* ============ 对战区 ============ */
  .battleSide{display:flex; align-items:center; gap:8px; height:50%; padding:16px 8px 4px; position:relative;}
  .bLab{left:10px; top:2px;}
  .battleSide + .battleSide{border-top:none;}
  .battleCards{display:flex; gap:5px; flex:1; min-width:0;}
  .scoreTag{flex:none; width:104px; background:#0007; border:2px solid var(--ink); border-radius:6px;
    text-align:center; padding:6px 2px;}
  .scoreTag .lab{font-size:10px; color:#9fb; display:block;}
  .scoreTag .val{font-size:22px; font-weight:900; color:var(--gold);}
  #battleResult{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); right:auto; font-size:15px; font-weight:bold;
    background:#0008; border:2px solid var(--gold); border-radius:6px; padding:4px 10px; color:var(--gold); z-index:4;}

  /* ============ AI 区（紧凑排列） ============ */
  /* AI 区：左边英雄牌，右边上面扑克牌区、紧挨着下面技能牌区（玩家区镜像） */
  #aiArea .boxbody{display:flex; gap:8px;}
  #aiHeroZone{flex:none; display:flex; align-items:center;}
  .aiRight{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .aiHidden{flex:1.08; display:flex; gap:5px; align-items:center; justify-content:center;
    background:#0005; border-radius:6px; padding:6px; min-height:0;}
  .aiSkills{flex:1; min-height:0; background:#0005; border-radius:6px; padding:6px; display:flex; gap:5px;
    align-items:center; justify-content:center; align-content:center; flex-wrap:wrap; overflow:hidden;}
  .aiSkills .miniUsed,.miniSkillBack{width:38px; height:52px; border-radius:4px; border:2px solid var(--ink);
    background:#241d3a; flex:none;}
  .aiSkills .miniUsed canvas{width:100%;height:100%;display:block;}
  .aiSkills .miniUsed{filter:grayscale(1) brightness(.6);}
  .miniSkillBack{position:relative; background:repeating-linear-gradient(45deg,#3a255f 0 6px,#241d3a 6px 12px);}
  /* AI 技能牌背面：不再显示「技」字 */

  /* ============ 玩家区 ============ */
  #pArea .boxbody{display:flex; gap:8px;}
  .pLeft{flex:none; width:138px; display:flex; flex-direction:column; gap:5px;}
  .pRight{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .handZone{flex:1.08; background:#0005; border-radius:6px; padding:6px; display:flex; gap:6px;
    align-items:center; justify-content:center; min-height:0; position:relative;}
  .skillZone{flex:1; background:#0005; border-radius:6px; padding:6px; display:flex; gap:6px;
    align-items:center; justify-content:center; min-height:0; position:relative;}
  .zoneLab{position:absolute; font-size:10px; color:#7fa88a; top:4px; left:8px;}
  .usedStrip{flex:none; min-height:38px; background:#0006; border-radius:5px; padding:4px;
    display:flex; gap:5px; align-items:center; overflow:hidden;}
  .usedStrip .uLab{font-size:10px; color:var(--gold); flex:none;}
  .usedStrip .miniUsed{width:26px; height:32px; border-radius:3px; border:1.5px solid var(--ink);
    background:#241d3a; flex:none; overflow:hidden;}

  /* ============ 牌堆 / 按钮区 ============ */
  #pileArea .boxbody{display:flex; flex-direction:column; gap:6px;}
  .pileRow{flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; align-items:end;}
  .pile{position:relative; width:46px; height:92px; margin:20px auto 0;}
  .pile .pcap{position:absolute; inset:0; border-radius:5px; border:2px solid #14181d;}
  .pile .pcount{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6;
    min-width:26px; padding:1px 7px; text-align:center; background:rgba(4,10,7,.68);
    border:1px solid #000; border-radius:5px;
    font-size:14px; font-weight:bold; color:var(--gold); text-shadow:1px 1px 0 #000;}
  .pile.small{width:46px; height:92px;}
  .pileWrap{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;}
  .pileWrap .plab{font-size:9px; color:#9fb; text-align:center; line-height:1.2; min-height:22px;}
  .ctrlBtns{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px; align-content:end;}
  .cbtn{background:var(--mid); color:#fff; border:2px solid var(--ink); border-radius:5px;
    padding:8px 4px; font-size:13px; font-weight:bold; box-shadow:2px 2px 0 #000;}
  .cbtn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 #000;}
  .cbtn.red{background:var(--red);} .cbtn.gold{background:var(--gold); color:var(--ink);}
  .infoLine{flex:none; background:#0007; border:2px solid var(--ink); border-radius:5px;
    padding:6px 8px; font-size:15px; line-height:1.5; color:#cfe8d4; text-align:center; font-weight:bold;}
  .infoLine b{color:var(--gold);}

  /* ============ 扑克牌 ============ */
  .pcard{position:relative; flex:none; background:var(--paper); color:var(--ink);
    border:2px solid var(--ink); border-radius:6px; box-shadow:2px 2px 0 #000;
    user-select:none; overflow:hidden;}
  .pcard .cr{position:absolute; top:3px; left:4px; font-size:13px; font-weight:900; line-height:1; text-align:center;}
  .pcard .cr small{display:block; font-size:11px;}
  .pcard .cs{position:absolute; top:0; left:0; right:0; bottom:16px; display:flex;
    align-items:center; justify-content:center; font-size:34px;}
  .pcard .cname{position:absolute; left:0; right:0; bottom:1px; text-align:center;
    font-size:10px; color:#6a5e44;}
  .pcard.redSuit{color:#c22;}
  .pcard.back{background:repeating-linear-gradient(45deg,#2f6b3f 0 7px,#1c3a2a 7px 14px); color:transparent;}
  .pcard.back .cr,.pcard.back .cs,.pcard.back .cname{display:none;}
  .pcard.back::after{content:"♣"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:26px; color:#7ec850; opacity:.55;}
  .pcard.clickable{cursor:pointer;}
  .pcard.clickable:hover{transform:translateY(-4px);}
  .pcard.sel{outline:4px solid var(--gold); outline-offset:1px; transform:translateY(-6px);}
  .pcard.target{outline:4px solid var(--blue); outline-offset:1px; transform:translateY(-4px);}
  .pcard.dim{filter:grayscale(.85) brightness(.5); opacity:.55;}
  .pcard.bigpop{animation:bigpop .6s ease;}
  @keyframes bigpop{0%{transform:scale(1);}50%{transform:scale(1.22); box-shadow:0 0 20px var(--gold);}100%{transform:scale(1);}}
  /* 尺寸 */
  .pcard.big{width:96px; height:134px;}
  .pcard.big .cs{font-size:42px;}
  .pcard.mid{width:64px; height:92px;}
  .pcard.mid .cr{font-size:11px;} .pcard.mid .cs{font-size:26px;} .pcard.mid .cname{display:none;}
  .pcard.sm{width:54px; height:76px;}
  .pcard.sm .cr{font-size:9px;} .pcard.sm .cs{font-size:19px;} .pcard.sm .cname{display:none;}

  /* ============ 技能牌（无文字描述，名字在底） ============ */
  .scard{position:relative; flex:none; background:#211a38; color:var(--paper);
    border:2px solid var(--ink); border-radius:6px; box-shadow:2px 2px 0 #000;
    user-select:none; overflow:hidden; cursor:pointer; width:94px; height:130px;}
  .scard .sart{position:absolute; top:6px; left:6px; right:6px; bottom:24px;
    background:#000; border:2px solid #000; border-radius:4px; overflow:hidden;}
  .scard .sart canvas{width:100%; height:100%; display:block;}
  .scard .snm{position:absolute; left:2px; right:2px; bottom:3px; text-align:center;
    font-size:12px; font-weight:bold;}
  .scard:hover{transform:translateY(-4px);}
  .scard.used{filter:grayscale(1) brightness(.5); cursor:not-allowed;}
  .scard.ready{outline:3px solid var(--gold); outline-offset:1px;}
  .scard.sel{outline:4px solid var(--gold); outline-offset:1px; transform:translateY(-6px);}
  .scard.sm{width:54px; height:76px;}
  .scard.sm .sart{bottom:16px;} .scard.sm .snm{font-size:9px;}

  /* 英雄牌 */
  .hcard{position:relative; flex:none; background:var(--panel2); border:var(--bd); border-radius:7px;
    box-shadow:3px 3px 0 #000; text-align:center; overflow:hidden; user-select:none;}
  .hcard .hart{position:relative; background:#000; border-bottom:2px solid var(--ink); overflow:hidden;}
  .hcard .hart canvas{display:block; width:100%; height:100%;}
  .hcard .hnm{font-size:12px; font-weight:bold; padding:3px 2px 1px;}
  .hcard .hhearts{padding:2px 4px 5px; display:flex; justify-content:center; gap:2px; flex-wrap:wrap;}
  .hcard .hh{width:13px; height:12px;}
  .hcard.poison{box-shadow:0 0 0 2px #4aff6a, 3px 3px 0 #000;}
  .hcard.hurt{animation:hhurt 1s ease;}
  @keyframes hhurt{0%,100%{transform:translate(0);}15%{transform:translate(-6px,2px);}
    30%{transform:translate(6px,-2px);}45%{transform:translate(-5px,-1px);}
    60%{transform:translate(5px,2px);}75%{transform:translate(-3px,0);}}
  .hcard.hurt::after{content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
    background:rgba(255,80,70,.28); animation:hurtTint 1s ease;}
  @keyframes hurtTint{0%,100%{opacity:0;}20%,70%{opacity:1;}}
  .claw{position:absolute; inset:0; z-index:8; pointer-events:none;}
  .claw i{position:absolute; left:7%; width:88%; height:10%;
    background:linear-gradient(90deg,transparent,#ff3a2a 28%,#ffd0c0 50%,#ff3a2a 72%,transparent);
    transform:rotate(-38deg); box-shadow:0 0 8px #ff5040; animation:clawin 1s ease;}
  .claw i:nth-child(1){top:22%;} .claw i:nth-child(2){top:45%; animation-delay:.08s;}
  .claw i:nth-child(3){top:68%; animation-delay:.16s;}
  @keyframes clawin{0%{opacity:0; transform:rotate(-38deg) translateX(-90%) scaleX(.45);}
    35%{opacity:1; transform:rotate(-38deg) translateX(0) scaleX(1);}
    75%,100%{opacity:0; transform:rotate(-38deg) translateX(12%) scaleX(1);}}
  .hcard.big{width:104px;} .hcard.big .hart{height:96px;}
  .hcard.mid{width:86px;} .hcard.mid .hart{height:78px;}

  /* ============ 悬停提示框 ============ */
  #tip{position:fixed; z-index:200; max-width:280px; background:#0d1326; color:#e8eaf2;
    border:2px solid var(--gold); border-radius:7px; padding:9px 11px; font-size:12px;
    line-height:1.65; box-shadow:4px 4px 0 #0008; display:none; pointer-events:none;}
  #tip b{color:var(--gold);} #tip .tt{display:block; font-weight:bold; color:#ffd88a; margin-bottom:3px; font-size:13px;}

  /* ============ 弹窗 ============ */
  .overlay{position:fixed; inset:0; background:#000000d5; z-index:100;
    display:flex; align-items:center; justify-content:center;}
  .modal{background:var(--panel); border:var(--bd); border-radius:10px;
    box-shadow:6px 6px 0 #000; padding:18px; max-width:760px; max-height:90vh; overflow-y:auto; position:relative;}
  .modal h2{color:var(--gold); font-size:19px; margin-bottom:10px; text-align:center;}
  .modal p,.modal li{font-size:13px; line-height:1.85; color:var(--paper);}
  .modal ul{padding-left:20px;}
  .btnrow{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:flex-end;}
  .mbtn{background:var(--mid); color:#fff; border:2px solid var(--ink); border-radius:6px;
    padding:9px 20px; font-size:14px; font-weight:bold; box-shadow:2px 2px 0 #000;}
  .mbtn.gold{background:var(--gold); color:var(--ink);}
  .mbtn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 #000;}
  /* 难度 / 选英雄 */
  .diffRow{display:flex; gap:12px; justify-content:center; margin:14px 0;}
  .diffBtn{padding:12px 26px; font-size:15px; font-weight:bold; border:var(--bd); border-radius:8px;
    background:var(--mid); color:#fff; box-shadow:3px 3px 0 #000;}
  .diffBtn.sel{background:var(--gold); color:var(--ink); outline:3px solid #fff;}
  .pickRow{display:flex; gap:14px; justify-content:center; margin:12px 0; flex-wrap:nowrap;}
  .pickCard{width:140px; background:var(--panel2); border:3px solid var(--ink); border-radius:8px;
    padding:8px; text-align:center; cursor:pointer; box-shadow:3px 3px 0 #000; flex:none;}
  .pickCard:hover{transform:translateY(-4px);}
  .pickCard.picked{outline:4px solid var(--gold);}
  .pickCard>canvas{width:96px; height:96px; background:#000; border:2px solid var(--ink); border-radius:4px;}
  .pickCard .hh{width:13px; height:12px;}
  .pickCard .hhearts{display:flex; justify-content:center; gap:2px; margin-top:4px;}
  .pickCard .pn{font-weight:bold; font-size:13px; margin-top:5px;}
  /* 牌型表 */
  .handTable{display:grid; grid-template-columns:0.55fr 1.1fr 0.8fr 1.6fr; gap:6px; margin-top:8px;}
  .handTable .hd{background:var(--panel2); padding:7px; font-size:12px; border:1px solid var(--ink); border-radius:5px;}
  .handTable .hd b{color:var(--gold); font-size:13px;}
  .handTable .hd .eg{color:#9fb; font-size:11px;}
  /* 中央大字 / 闪光 / 粒子 */
  #centerMsg{position:fixed; left:50%; top:42%; transform:translate(-50%,-50%);
    font-size:40px; font-weight:900; color:var(--gold); text-shadow:4px 4px 0 #000;
    z-index:60; pointer-events:none; text-align:center; display:none;}
  #flash{position:fixed; inset:0; pointer-events:none; z-index:90; opacity:0;}
  #fxLayer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:80;}
  .particle{position:absolute; width:5px; height:5px; background:#4aff6a;}
  #toast{position:fixed; left:50%; top:12%; transform:translateX(-50%); z-index:150;
    background:#3a1414; color:#ffd0c0; border:2px solid var(--red); border-radius:6px;
    padding:8px 16px; font-size:14px; font-weight:bold; display:none;}
  /* 飞牌幽灵 */
  .flyGhost{position:fixed; z-index:120; pointer-events:none; margin:0 !important;}
</style>
</head>
<body>
<div id="screen">
  <!-- 左上：对战区 -->
  <div class="box" id="battle">
    <div id="battleResult" style="display:none;"></div>
    <div class="boxbody" style="padding:4px;">
      <div class="battleSide"><span class="zoneLab bLab">AI 出牌区</span><div class="battleCards" id="aiBattleCards"></div>
        <div class="scoreTag"><span class="lab">AI 总分</span><span class="val" id="aiBattleScore">-</span></div></div>
      <div class="battleSide"><span class="zoneLab bLab">你的出牌区</span><div class="battleCards" id="pBattleCards"></div>
        <div class="scoreTag"><span class="lab">你的总分</span><span class="val" id="pBattleScore">-</span></div></div>
    </div>
  </div>
  <!-- 右上：AI 区域 -->
  <div class="box" id="aiArea">
    <div class="boxbody">
      <div id="aiHeroZone" style="flex:none;"></div>
      <div class="aiRight">
        <div class="aiHidden" id="aiHiddenRow"></div>
        <div class="aiSkills" id="aiSkillMini"><span style="font-size:11px;color:#7fa88a;">AI 本局已用技能</span></div>
      </div>
    </div>
  </div>
  <!-- 左下：玩家区域 -->
  <div class="box" id="pArea">
    <div class="boxbody">
      <div class="pLeft">
        <div id="pHeroZone"></div>
        <button class="cbtn gold" id="discardBtn" style="display:none;">换 牌</button>
        <button class="cbtn" id="playBtn" style="display:none;">出 牌</button>
        <button class="cbtn" id="sortBtn">排 序</button>
        <button class="cbtn red" id="discardSkillBtn" style="display:none;">丢 弃</button>
        <div class="usedStrip" id="usedStrip"><span class="uLab">技能牌 · 本局已用</span></div>
      </div>
      <div class="pRight">
        <div class="handZone" id="handZone"></div>
        <div class="skillZone" id="skillZone"></div>
      </div>
    </div>
  </div>
  <!-- 右下：牌堆 + 控制 -->
  <div class="box" id="pileArea">
    <div class="boxbody">
      <div class="pileRow">
        <div class="pileWrap"><div class="pile" id="pilePokerDraw"></div><span class="plab">扑克抽牌库</span></div>
        <div class="pileWrap"><div class="pile" id="pilePokerDisc"></div><span class="plab">扑克弃牌库</span></div>
        <div class="pileWrap"><div class="pile small" id="pileSkDraw"></div><span class="plab">技能抽牌库</span></div>
        <div class="pileWrap"><div class="pile small" id="pileSkDisc"></div><span class="plab">技能弃牌库</span></div>
      </div>
      <div class="infoLine" id="infoLine">—</div>
      <div class="ctrlBtns">
        <button class="cbtn red" id="surrBtn">投降/重开</button>
        <button class="cbtn" id="pauseBtn">暂停</button>
        <button class="cbtn" id="helpBtn">玩法说明</button>
        <button class="cbtn" id="handBtn">牌型计分</button>
        <button class="cbtn" id="logBtn">游戏日志</button>
      </div>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="centerMsg"></div>
<div id="flash"></div>
<div id="fxLayer"></div>
<script>
/* =====================================================================
   POKER_CFG —— 游戏全部可调数值（编辑器读写此块；最终 } 顶格 column 0）
===================================================================== */

        skill: 60
      },

      maxSkillsPerRound: 3,

          pact: 0.5,

          critDmg: 1
        },

      },
      skills: {

          count: 2,

        conjure: {

        refresh: {
          count: 1

        nether: {
          count: 2,
          maxRank: 5
        },
        forceStaff: {
          count: 2,
          pickMin: 1,
          pick: 2,
          plus: 1
        },
        mechasm: {
          count: 2,
          baseBonus: 10
        },
        daedalus: {

          ptsMult: 1.3
        },
        aegis: {

        bloodstone: {

          extraSkill: 1
        },
        phase: {
          count: 1,
          ptsMult: 1.5
        },
        drum: {
          count: 1,
          totalBonus: 15
        },
        heart: {

          totalMult: 1.2
        },
        shiva: {
          count: 2,
          minLevel: 3,
          totalBonus: 12
        },
        ring: {
          count: 1,
          extraSwap: 1
        },
        armlet: {
          count: 2,
          baseBonus: 15,
          backfire: 0.5
        },
        headdress: {
          count: 1,
          heal: 0.5
        },
        deso: {
          count: 2,
          permaBase: 5
        },
        potion: {
          count: 2
        },
        bkb: {
          count: 1

/* ---------------- 手牌评估（纯函数，支持 1~5 张子集） ----------------
   返回 {level,key,name,usedIdx(参与计分的输入下标),points(有效牌点数和),
          isFlush,isStraight,counts,rankKey} */
function evaluateHand(cards){
  var n=cards.length;
  var idx=cards.map(function(c,i){return i;});
  var ranksAll=cards.map(function(c){return c.rank;});
  var orderDesc=idx.slice().sort(function(a,b){return ranksAll[b]-ranksAll[a] || a-b;});
  var ranks=orderDesc.map(function(i){return ranksAll[i];});
  var suits=cards.map(function(c){return c.suit;});
  var cnt={}; ranksAll.forEach(function(r){cnt[r]=(cnt[r]||0)+1;});
  var groups=Object.keys(cnt).map(function(k){return cnt[k];}).sort(function(a,b){return b-a;});
  var level=0, usedIdx=[], rankKey=[];
  function useRank(r,limit){
    var got=0;
    orderDesc.forEach(function(i){ if(ranksAll[i]===r && got<limit){usedIdx.push(i); got++;} });
  }
  function useAll(){ orderDesc.forEach(function(i){usedIdx.push(i);}); }
  var isFlush=false, isStraight=false;
  if(n===5){
    isFlush = suits.every(function(s){return s===suits[0];});
    var sorted=ranks.slice().sort(function(a,b){return a-b;});
    isStraight=true;
    for(var i=1;i<5;i++){ if(sorted[i]!==sorted[i-1]+1){isStraight=false;break;} }
    var wheel=(sorted[0]===2&&sorted[1]===3&&sorted[2]===4&&sorted[3]===5&&sorted[4]===14);
    if(wheel) isStraight=true;
    if(groups[0]===5){ level=isFlush?11:10; useAll(); rankKey=[ranksAll[0]]; }
    else if(isStraight&&isFlush){
      if(ranks[0]===14&&ranks[1]===13){ level=9; useAll(); rankKey=[14]; }
      else { level=8; useAll(); rankKey=wheel?[5]:ranks.slice(0,1); }
    } else if(groups[0]===4){ level=7;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===4)useRank(+k,4);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===4;}).map(Number).
        concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===4?false:true;}).map(function(i){return ranksAll[i];}));
    } else if(groups[0]===3&&groups[1]===2){ level=6; useAll();
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===3;}).map(Number)
        .concat(Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number));
    } else if(isFlush){ level=5; useAll(); rankKey=ranks.slice(); }
    else if(isStraight){ level=4; useAll(); rankKey=wheel?[5]:ranks.slice(0,1); }
    else if(groups[0]===3){ level=3;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===3)useRank(+k,3);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===3;}).map(Number)
        .concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]<3;}).map(function(i){return ranksAll[i];}));
    } else if(groups[0]===2&&groups[1]===2){ level=2;
      var pairRanks=Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number).sort(function(a,b){return b-a;});
      pairRanks.forEach(function(r){useRank(r,2);});
      rankKey=pairRanks.concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===1;}).map(function(i){return ranksAll[i];}));
    } else if(groups[0]===2){ level=1;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===2)useRank(+k,2);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number)
        .concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===1;}).map(function(i){return ranksAll[i];}));
    } else { level=0; usedIdx=[orderDesc[0]]; rankKey=ranks.slice(); }
  } else if(n===4){
    if(groups[0]===4){ level=7; useAll(); rankKey=[ranks[0]]; }
    else if(groups[0]===3){ level=3;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===3)useRank(+k,3);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===3;}).map(Number)
        .concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===1;}).map(function(i){return ranksAll[i];}));
    } else if(groups[0]===2&&groups[1]===2){ level=2;
      var pr2=Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number).sort(function(a,b){return b-a;});
      pr2.forEach(function(r){useRank(r,2);}); rankKey=pr2;
    } else if(groups[0]===2){ level=1;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===2)useRank(+k,2);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number)
        .concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===1;}).map(function(i){return ranksAll[i];}));
    } else { level=0; usedIdx=[orderDesc[0]]; rankKey=ranks.slice(); }
  } else if(n===3){
    if(groups[0]===3){ level=3; useAll(); rankKey=[ranks[0]]; }
    else if(groups[0]===2){ level=1;
      Object.keys(cnt).forEach(function(k){if(cnt[k]===2)useRank(+k,2);});
      rankKey=Object.keys(cnt).filter(function(k){return cnt[k]===2;}).map(Number)
        .concat(orderDesc.filter(function(i){return cnt[ranksAll[i]]===1;}).map(function(i){return ranksAll[i];}));
    } else { level=0; usedIdx=[orderDesc[0]]; rankKey=ranks.slice(); }
  } else if(n===2){
    if(groups[0]===2){ level=1; useAll(); rankKey=[ranks[0]]; }
    else { level=0; usedIdx=[orderDesc[0]]; rankKey=ranks.slice(); }
  } else if(n===1){ level=0; usedIdx=[0]; rankKey=[ranksAll[0]]; }
  var points=usedIdx.reduce(function(s,i){return s+ranksAll[i];},0);
  return {level:level, key:HAND_KEYS[level], name:HAND_NAMES[level], points:points,
          usedIdx:usedIdx, isFlush:isFlush, isStraight:isStraight, counts:cnt, rankKey:rankKey};
}

/* ---------------- 计分（纯函数） ----------------
   mod = {baseAdd,baseMult,ptsAdd,ptsMult,totalAdd,totalMult,permaBase} */
function computeScore(handRes, mod){
  mod=mod||{};
  var baseAdd=mod.baseAdd||0, baseMult=mod.baseMult||1;
  var ptsAdd=mod.ptsAdd||0, ptsMult=mod.ptsMult||1;
  var totalAdd=mod.totalAdd||0, totalMult=mod.totalMult||1, permaBase=mod.permaBase||0;
  var base=C.hands[handRes.key]+permaBase;
  var sub=(base+baseAdd)*baseMult + (handRes.points+ptsAdd)*ptsMult;
  var final=(sub+totalAdd)*totalMult;
  return Math.round(final*100)/100;
}

    var n=rows.length,m=rows[0].length, sx=canvas.width/m, sy=canvas.height/n;
    for(var y=0;y<n;y++){for(var x=0;x<m;x++){
      var ch=rows[y][x]; if(!pal[ch]) continue;
      ctx.fillStyle=pal[ch];
      ctx.fillRect(Math.floor(x*sx),Math.floor(y*sy),Math.ceil(sx),Math.ceil(sy));
    }}
  }
};

/* ---------------- 音效 ---------------- */
var AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(freq,dur,type,vol){
  var ctx=audio();if(!ctx)return;
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.1,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);
}
var SFX={
  deal:function(){tone(600,.06,'square',.07);},
  discard:function(){tone(300,.08,'sawtooth',.09);},
  skill:function(){tone(880,.12,'triangle',.1);setTimeout(function(){tone(1200,.1,'triangle',.09);},60);},
  reveal:function(){tone(440,.15,'square',.09);setTimeout(function(){tone(660,.2,'square',.09);},120);},
  hurt:function(){tone(160,.25,'sawtooth',.13);},
  win:function(){[523,659,784].forEach(function(f,i){setTimeout(function(){tone(f,.15,'triangle',.1);},i*120);});},
  lose:function(){[400,300,200].forEach(function(f,i){setTimeout(function(){tone(f,.2,'sawtooth',.1);},i*150);});}
};

function makeCard(suit,rank){return {suit:suit,rank:rank,origSuit:suit,origRank:rank,
  uid:suit+rank+'_'+Math.random().toString(36).slice(2)};}
function buildPokerDeck(){
  var d=[];SUITS.forEach(function(s){for(var r=2;r<=14;r++)d.push(makeCard(s,r));});
  return shuffle(d);
}
function buildSkillDeck(){
  var d=[];Object.keys(C.skills).forEach(function(k){
    for(var i=0;i<C.skills[k].count;i++)d.push({key:k,uid:k+'_'+Math.random().toString(36).slice(2)});});
  return shuffle(d);
}
function drawOne(who){
  if(G.pokerDraw.length===0){G.pokerDraw=shuffle(G.pokerDiscard);G.pokerDiscard=[];}
  var tries=0;
  while(G.pokerDraw.length&&tries<80){
    var card=G.pokerDraw.pop();
    if(who.hero==='bloodMage'&&card.rank<=C.heroes.bloodMage.skipMaxRank){
      G.pokerDiscard.push(card);tries++;
      if(G.pokerDraw.length===0&&G.pokerDiscard.length>0){G.pokerDraw=shuffle(G.pokerDiscard);G.pokerDiscard=[];}
      continue;}
    return card;
  }
  if(G.pokerDraw.length===0&&G.pokerDiscard.length>0){G.pokerDraw=shuffle(G.pokerDiscard);G.pokerDiscard=[];}
  return G.pokerDraw.pop();
}
function drawSkill(who){
  if(who.skDraw.length===0){who.skDraw=shuffle(who.skDiscard);who.skDiscard=[];}
  if(who.skDraw.length===0)return null;
  return who.skDraw.pop();
}
function skillCap(who){return who.hero==='archMage'?C.skillHandCapMage:C.skillHandCap;}
function toDiscard(card){G.pokerDiscard.push(makeCard(card.origSuit,card.origRank));}

var HEART_ROWS=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function drawHeart(canvas,st){
  var ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  function pixels(color){
    ctx.fillStyle=color;
    var sx=canvas.width/7,sy=canvas.height/HEART_ROWS.length;
    for(var y=0;y<HEART_ROWS.length;y++)for(var x=0;x<HEART_ROWS[y].length;x++){
      if(HEART_ROWS[y][x]!=='.')ctx.fillRect(Math.floor(x*sx),Math.floor(y*sy),Math.ceil(sx),Math.ceil(sy));
    }
  }
  if(st==='full')pixels('#e23d3d');
  else{pixels('#5a2222');
    if(st==='half'){ctx.save();ctx.beginPath();ctx.rect(0,0,canvas.width/2,canvas.height);ctx.clip();pixels('#e23d3d');ctx.restore();}
  }
}
function heartsHTML(hp,maxHp,w,h){
  var s='',n=Math.ceil(maxHp);
  for(var i=0;i<n;i++){var v=hp-i;
    s+='<canvas class="hh" data-st="'+(v>=1?'full':v>0?'half':'empty')+'" width="'+w+'" height="'+h+'"></canvas>';}
  return s;
}
function paintHearts(scope){scope.querySelectorAll('canvas.hh').forEach(function(cv){drawHeart(cv,cv.dataset.st);});}

/* ---------------- 悬停提示 ---------------- */
var tipEl=$('tip'),tipTimer=null;
function bindTip(el,title,tag,text){
  el.addEventListener('mouseenter',function(){
    clearTimeout(tipTimer);
    tipTimer=setTimeout(function(){showTip(el,title,tag,text);},100);});
  el.addEventListener('mouseleave',function(){clearTimeout(tipTimer);tipEl.style.display='none';});
}
function showTip(anchor,title,tag,text){
  tipEl.innerHTML='<span class="tt">'+title+'</span>'+(tag?'<div>'+tag+'</div>':'')+'<p>'+text+'</p>';
  tipEl.style.display='block';
  var r=anchor.getBoundingClientRect();
  var tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  var x=r.right+12;if(x+tw>innerWidth-8)x=r.left-tw-12;
  var y=clamp(r.top,8,innerHeight-th-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}

function rectOf(el){if(!el)return null;var r=el.getBoundingClientRect();
  return {x:r.x,y:r.y,w:r.width,h:r.height};}
function flyTo(fr,to,inner,dur,cb){
  if(!fr){if(cb)cb();return;}
  var g=document.createElement('div');g.className='flyGhost';
  g.style.left=fr.x+'px';g.style.top=fr.y+'px';g.style.width=fr.w+'px';g.style.height=fr.h+'px';
  g.innerHTML=inner;document.body.appendChild(g);
  var dx=to?to.x-fr.x:0,dy=to?to.y-fr.y:0;
  var sx=to?to.w/fr.w:1,sy=to?to.h/fr.h:1;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    g.style.transition='transform '+(dur||380)+'ms cubic-bezier(.45,.05,.5,1)';
    g.style.transformOrigin='0 0';
    g.style.transform='translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')';});});
  setTimeout(function(){g.remove();if(cb)cb();},(dur||380)+40);
}

function suitSortValue(suit){
  var order={'♠':0,'♥':1,'♣':2,'♦':3};
  return Object.prototype.hasOwnProperty.call(order,suit)?order[suit]:9;
}
function sortPlayerHand(){
  if(!G||!G.p||!G.p.hand)return;
  G.p.hand.sort(function(a,b){
    if(G.sortMode===1){
      var ss=suitSortValue(a.suit)-suitSortValue(b.suit);
      if(ss)return ss;
      return b.rank-a.rank;
    }
    var rr=b.rank-a.rank;
    if(rr)return rr;
    return suitSortValue(a.suit)-suitSortValue(b.suit);
  });
}
function toggleSkillDiscard(sk){
  if(G.phase!=='skill'||G.busy||G.paused)return;
  if(G.skillPicks[sk.uid])delete G.skillPicks[sk.uid];else G.skillPicks[sk.uid]=1;

function confirmDiscardSkills(){

    G.skillDiscardMode=true;G.skillPicks={};renderAll();toast('点击要丢弃的技能牌，再点确认丢弃');return;

  var ids=Object.keys(G.skillPicks);
  if(ids.length===0){G.skillDiscardMode=false;G.skillPicks={};renderAll();toast('已取消丢弃');return;}

    if(G.skillPicks[sk.uid])G.p.skDiscard.push(sk);else kept.push(sk);

function phaseName(){

/* ---------------- 计时器 ---------------- */
function startTimer(secs,cb){
  stopTimer();G.timeLeft=secs;G._cb=cb;renderInfo();
  G.timer=setInterval(function(){
    if(G.paused||G.over)return;
    G.timeLeft--;renderInfo();
    if(G.timeLeft<=0){stopTimer();if(G._cb)G._cb();}
  },1000);
}
function stopTimer(){if(G&&G.timer){clearInterval(G.timer);G.timer=null;}}

/* ---------------- 回合开始 ---------------- */
function startRound(){
  G.round++;
  G.discardSel=[];G.handPicks={};G.skillPicks={};G.skillDiscardMode=false;
  [G.p,G.ai].forEach(function(w){
    if(w.headdressPending>0){w.hp=Math.min(w.maxHp,w.hp+C.skills.headdress.heal);w.headdressPending--;}
    if(w.salveTurns>0){w.hp=Math.min(w.maxHp,w.hp+C.skills.lifepotion.heal);w.salveTurns--;}
  });
  if(G.round===1){
    [G.p,G.ai].forEach(function(w){
      var n=w.hero==='archMage'?C.skillStartHandMage:C.skillStartHand;
      for(var s=0;s<n;s++){var d0=drawSkill(w);if(d0)w.skHand.push(d0);}
    });
  } else {
    refillSkills(G.p);refillSkills(G.ai);
  }
  dealAnimated(G.p,function(){
    dealAnimated(G.ai,function(){
      sortPlayerHand();
      G.phase='discard';G.discardSel=[];G.handPicks={};G.busy=false;
      renderAll();
      startTimer(C.time.discard,function(){doDiscard(true);});
    });
  });
}
function refillSkills(w){
  var cap=skillCap(w);
  if(w.bloodstonePending>0){
    for(var i=0;i<w.bloodstonePending&&w.skHand.length<cap;i++){var b0=drawSkill(w);if(b0)w.skHand.push(b0);}
    w.bloodstonePending=0;
  }
  for(var j=0;j<C.skillRefillPerRound&&w.skHand.length<cap;j++){var r0=drawSkill(w);if(r0)w.skHand.push(r0);}
}
function dealAnimated(w,cb){
  w.hand=[];w.played=[];w.playedRes=null;w.usedSkills=[];w.armletPending=false;w.critUsed=false;w.critUsed=false;
  w.pendingMod=freshMod();
  var dest=w.isAI?$('aiHiddenRow'):$('handZone');
  var src=$('pilePokerDraw');
  renderAll();
  var i=0;
  (function next(){
    if(i>=C.startCards){cb();return;}
    var card=drawOne(w);w.hand.push(card);renderAll();
    var kids=dest.children;var target=kids[kids.length-1];
    target.style.visibility='hidden';
    flyTo(rectOf(src),rectOf(target),backGhost(src.offsetWidth,src.offsetHeight),300,function(){
      target.style.visibility='';SFX.deal();i++;next();});
  })();
}

/* ---------------- 换牌 ---------------- */
function onHandClick(i){
  if(G.paused||G.busy)return;
  if(G.phase==='discard'){
    var p=G.discardSel.indexOf(i);
    if(p>=0)G.discardSel.splice(p,1);else G.discardSel.push(i);
    SFX.discard();renderAll();
  } else if(G.phase==='skill'){
    if(G.handPicks[i])delete G.handPicks[i];else G.handPicks[i]=1;
    SFX.discard();renderAll();
  }
}
function doDiscard(timeout){
  if(G.phase!=='discard'||G.busy)return;
  G.busy=true;
  var sel=G.discardSel.slice().sort(function(a,b){return b-a;});
  swapAnimated(G.p,sel,function(){
    G.discardSel=[];
    // AI 换牌（含王者戒额外一次）
    aiDiscard();
    if(G.ai.extraSwap>0){G.ai.extraSwap--;aiDiscard();}
    if(G.p.extraSwap>0&&!timeout){
      G.p.extraSwap--;G.busy=false;G.phase='discard';renderAll();
      startTimer(C.time.discard,function(){doDiscard(true);});
      return;
    }
    enterSkill();
  });
}
function swapAnimated(w,sel,cb){
  if(sel.length===0){cb();return;}
  var hz=w.isAI?$('aiHiddenRow'):$('handZone');
  var disc=$('pilePokerDisc'),draw=$('pilePokerDraw');
  var removed=sel.map(function(i){return {c:w.hand[i],r:rectOf(hz.children[i])};});
  sel.forEach(function(i){hz.children[i].style.visibility='hidden';});
  var flown=0;
  removed.forEach(function(o){
    flyTo(o.r,rectOf(disc),backGhost(o.r.w,o.r.h),340,function(){flown++;
      if(flown===removed.length)redraw();});
  });
  function redraw(){
    removed.forEach(function(o){var i=w.hand.indexOf(o.c);w.hand.splice(i,1);toDiscard(o.c);});
    var n=removed.length,arrived=0;
    (function drawNext(){
      if(arrived>=n){if(!w.isAI)sortPlayerHand();cb();return;}
      var nc=drawOne(w);w.hand.push(nc);renderAll();
      var z=w.isAI?$('aiHiddenRow'):$('handZone');
      var t=z.children[z.children.length-1];t.style.visibility='hidden';
      flyTo(rectOf(draw),rectOf(t),backGhost(draw.offsetWidth,draw.offsetHeight),320,function(){
        t.style.visibility='';SFX.deal();arrived++;drawNext();});
    })();
  }
}
function enterSkill(){
  G.phase='skill';G.handPicks={};G.skillPicks={};G.skillDiscardMode=false;G.busy=false;renderAll();
  startTimer(C.time.skill,function(){requestPlay(true);});
  setTimeout(aiSkillPlan,500);
}

/* ---------------- 技能（玩家） ---------------- */
function freshMod(){return {baseAdd:0,baseMult:1,ptsAdd:0,ptsMult:1,totalAdd:0,totalMult:1,flags:{}};}
function onSkillClick(sk){
  if(G.phase!=='skill'||G.busy||G.paused)return;
  if(G.p.usedSkills.length>=C.maxSkillsPerRound){toast('每回合最多使用 '+C.maxSkillsPerRound+' 张技能牌');return;}
  var key=sk.key,cfg=C.skills[key];
  if(TARGETED[key]){
    var idxs=Object.keys(G.handPicks).map(Number);
    var mn=cfg.pickMin||cfg.pick,mx=cfg.pick;
    if(idxs.length<mn||idxs.length>mx){
      toast('请先高光 '+mn+(mx>mn?'～'+mx:'')+' 张扑克牌，再点「'+SKILL_DEFS[key].name+'」');return;}
    applyTargeted(G.p,key,idxs);
  } else {
    applyInstant(G.p,key,cfg);
  }
  consumeSkill(G.p,sk);
}
function consumeSkill(w,sk){
  var i=w.skHand.indexOf(sk);if(i>=0){w.skHand.splice(i,1);w.skDiscard.push(sk);}
  w.usedSkills.push(sk.key);
  w.pendingMod=w.pendingMod||freshMod();
  G.skillDiscardMode=false;G.skillPicks={};
  if(!w.isAI)sortPlayerHand();
  SFX.skill();flash('#7ec850');G.handPicks={};renderAll();
}
/* 改牌类技能的真实规则；AI 推演调用的是同一份，保证和真人规则一致 */
function mutateHand(hand,key,idxs,cfg){
  if(key==='midas')idxs.forEach(function(i){hand[i].rank=cfg.toRank;});
  else if(key==='spadeWish')idxs.forEach(function(i){hand[i].suit='♠';});
  else if(key==='forceStaff')idxs.forEach(function(i){hand[i].rank=Math.min(14,hand[i].rank+cfg.plus);});
  else if(key==='meteor')idxs.forEach(function(i){hand[i].rank=Math.min(14,hand[i].rank+cfg.plus);});
  else if(key==='manta'){
    var rr=hand[idxs[0]].rank;
    var others=hand.map(function(c,i){return {c:c,i:i};})
      .filter(function(o){return o.i!==idxs[0];}).sort(function(a,b){return a.c.rank-b.c.rank;});
    if(others[0])others[0].c.rank=rr;
  }
}
function applyTargeted(w,key,idxs){mutateHand(w.hand,key,idxs,C.skills[key]);}
function applyInstant(w,key,cfg){
  var m=w.pendingMod=w.pendingMod||freshMod();
  switch(key){
    case 'conjure':
      for(var d=0;d<cfg.draw;d++)if(w.skHand.length<skillCap(w)){var c0=drawSkill(w);if(c0)w.skHand.push(c0);}
      break;
    case 'refresh':{
      var n=w.skHand.length;
      w.skHand.forEach(function(s){w.skDiscard.push(s);});w.skHand=[];
      for(var r=0;r<n;r++){var f0=drawSkill(w);if(f0)w.skHand.push(f0);}
      break;}
    case 'nether':{
      var low=w.hand.filter(function(c){return c.rank<=cfg.maxRank;});
      low.forEach(function(c){var i=w.hand.indexOf(c);w.hand.splice(i,1);toDiscard(c);});
      for(var k=0;k<low.length;k++)w.hand.push(drawOne(w));
      break;}
    case 'potion':{
      var s=w.hand.slice().sort(function(a,b){return a.rank-b.rank;})[0];
      if(s){var i=w.hand.indexOf(s);w.hand.splice(i,1);toDiscard(s);w.hand.push(drawOne(w));}
      break;}
    case 'mechasm':m.baseAdd+=cfg.baseBonus;break;
    case 'armlet':m.baseAdd+=cfg.baseBonus;w.armletPending=true;break;
    case 'daedalus':m.ptsMult*=cfg.ptsMult;break;
    case 'aegis':m.flags.aegis=true;break;
    case 'bloodstone':m.flags.bloodstone=true;break;
    case 'phase':m.flags.phase=true;break;
    case 'drum':m.flags.drum=true;break;
    case 'heart':m.totalMult*=cfg.totalMult;break;
    case 'shiva':m.flags.shiva=true;break;
    case 'ring':w.extraSwap+=cfg.extraSwap;break;
    case 'headdress':m.flags.headdress=true;break;
    case 'deso':m.flags.deso=true;break;
    case 'bkb':m.flags.bkb=true;break;
    case 'butterfly':m.flags.butterfly=true;break;
    case 'dagon':m.flags.dagon=true;break;
    case 'bfury':m.flags.bfury=true;break;
    case 'circlet':m.flags.circlet=true;break;
    case 'lifepotion':w.salveTurns=cfg.rounds;break;
    case 'magicStick':m.flags.magicStick=true;break;
    case 'veil':m.flags.veil=true;break;
  }
}

/* ---------------- 出牌 ---------------- */
function requestPlay(auto){
  if(G.phase!=='skill'||G.busy)return;
  /* 只打出高光选中的牌；没选中的直接进弃牌堆 */
  var idxs=Object.keys(G.handPicks).map(Number);
  if(idxs.length===0){
    if(!auto){toast('先点选要打出的扑克牌（没选中的会进弃牌堆）');return;}
    idxs=G.p.hand.map(function(_,i){return i;});   // 超时兜底：全部打出
  }
  G.skillDiscardMode=false;G.skillPicks={};
  G.busy=true;stopTimer();
  // 先记录所有起点
  var pz=$('handZone'),az=$('aiHiddenRow');
  var pRects=[],aRects=[];
  for(var i=0;i<pz.children.length;i++)pRects.push(rectOf(pz.children[i]));
  for(var j=0;j<az.children.length;j++)aRects.push(rectOf(az.children[j]));
  var keep=idxs.slice().sort(function(a,b){return a-b;});
  var dropIdx=pRects.map(function(_,i){return i;}).filter(function(i){return keep.indexOf(i)<0;});
  var disc=$('pilePokerDisc');
  dropIdx.forEach(function(i){pz.children[i].style.visibility='hidden';
    flyTo(pRects[i],rectOf(disc),backGhost(pRects[i].w,pRects[i].h),350);});
  setTimeout(function(){
    // 先取出要打出的牌（splice 前，避免索引错位）
    var playedCards=keep.slice().sort(function(a,b){return a-b;})
      .map(function(i){return G.p.hand[i];});
    // 未选进弃牌堆
    dropIdx.sort(function(a,b){return b-a;}).forEach(function(i){
      toDiscard(G.p.hand[i]);G.p.hand.splice(i,1);});
    G.p.played=playedCards;
    G.ai.played=G.ai.hand.slice();G.ai.hand=[];G.p.hand=[];
    renderBattleFaces();
    var pb=$('pBattleCards'),ab=$('aiBattleCards');
    var n=0,total=G.p.played.length+G.ai.played.length;
    function tick(){n++;if(n>=total)finish();}
    G.p.played.forEach(function(c,k){
      flyTo(pRects[keep[k]],rectOf(pb.children[k]),backGhost(pRects[keep[k]].w,pRects[keep[k]].h),360,tick);});
    G.ai.played.forEach(function(c,k){
      flyTo(aRects[k],rectOf(ab.children[k]),backGhost(aRects[k].w,aRects[k].h),360,tick);});
    if(total===0)finish();
    function finish(){G.phase='reveal';renderAll();setTimeout(resolveReveal,400);}
  },380);
}
function renderBattleFaces(){
  var pb=$('pBattleCards'),ab=$('aiBattleCards');
  pb.innerHTML='';ab.innerHTML='';
  G.p.played.forEach(function(c){pb.insertAdjacentHTML('beforeend',pcardHTML(c,{size:'mid'}));});
  G.ai.played.forEach(function(c){ab.insertAdjacentHTML('beforeend',pcardHTML(c,{back:true,size:'mid'}));});
}

/* ---------------- AI ---------------- */
/* ================= 新 AI：先推演、再决策 =================
   和真人拿到一样的信息：只看自己的手牌、技能牌、双方血量。
   难度由 CFG.ai 的强度值换算成 aiProfile()，越强越会换牌、越会挑技能、失误越少。 */
function aiProfile(agg){
  /* 三档基准（难度值 0 / 0.4 / 1.6），中间值线性插值，
     后台编辑器里调的就是 CFG.ai 那三个数字 */
  var LV=[
    {k:0,   thr:150,samples:1, noise:0.85,maxSkill:1,iq:0.00},
    {k:0.4, thr:42, samples:6, noise:0.22,maxSkill:2,iq:0.44},
    {k:1.6, thr:4,  samples:20,noise:0.00,maxSkill:3,iq:1.00}
  ];
  var lo=LV[0],hi=LV[2];
  if(agg<=LV[0].k){lo=hi=LV[0];}
  else if(agg>=LV[2].k){lo=hi=LV[2];}
  else for(var i=0;i<2;i++)if(agg>=LV[i].k&&agg<=LV[i+1].k){lo=LV[i];hi=LV[i+1];break;}
  var t=(hi.k===lo.k)?0:(agg-lo.k)/(hi.k-lo.k);
  function mix(key){return lo[key]+(hi[key]-lo[key])*t;}
  return {a:clamp(agg,0,3)/1.6,
    thr:mix('thr'),                                    // 技能收益门槛(分)：越高越少用技能
    samples:Math.max(1,Math.round(mix('samples'))),    // 换牌推演抽样次数：越多越会换
    noise:mix('noise'),                                // 换牌失误率
    maxSkill:Math.max(1,Math.round(mix('maxSkill'))),  // 每回合最多用几张技能
    iq:mix('iq')};                                     // 挑目标牌 / 挑英雄的精度
}

/* ---------- 推演用快照：只动拷贝，不影响真实牌局 ---------- */
function cpCard(c){return {suit:c.suit,rank:c.rank,origSuit:c.origSuit,origRank:c.origRank,uid:c.uid};}
function cpHand(h){return h.map(cpCard);}
function cpMod(m){
  var r=freshMod();
  if(!m)return r;
  r.baseAdd=m.baseAdd;r.baseMult=m.baseMult;r.ptsAdd=m.ptsAdd;r.ptsMult=m.ptsMult;
  r.totalAdd=m.totalAdd;r.totalMult=m.totalMult;
  Object.keys(m.flags||{}).forEach(function(k){r.flags[k]=m.flags[k];});
  return r;
}
function snapState(w){
  return {hand:cpHand(w.hand),skHand:w.skHand.slice(),skDiscard:w.skDiscard.slice(),skDraw:w.skDraw.slice(),
    pendingMod:cpMod(w.pendingMod),extraSwap:w.extraSwap,salveTurns:w.salveTurns,
    armletPending:w.armletPending,bloodstonePending:w.bloodstonePending,headdressPending:w.headdressPending,
    pokerDraw:G.pokerDraw.slice(),pokerDiscard:G.pokerDiscard.slice()};
}
function loadState(w,s){
  w.hand=cpHand(s.hand);w.skHand=s.skHand.slice();w.skDiscard=s.skDiscard.slice();w.skDraw=s.skDraw.slice();
  w.pendingMod=cpMod(s.pendingMod);w.extraSwap=s.extraSwap;w.salveTurns=s.salveTurns;
  w.armletPending=s.armletPending;w.bloodstonePending=s.bloodstonePending;w.headdressPending=s.headdressPending;
  G.pokerDraw=s.pokerDraw.slice();G.pokerDiscard=s.pokerDiscard.slice();
}
function modForScore(w,res,oppRes){
  var keep=w.pendingMod;
  w.pendingMod=cpMod(keep);
  var m=buildMod(w,res,false,oppRes);
  w.pendingMod=keep;
  return m;
}
/* 拿一份手牌算出最终得分（不落地） */
function scoreOfHand(w,hand,oppRes){
  var sh=w.hand,sp=w.played;
  w.hand=hand;w.played=hand;
  var res=evaluateHand(hand);
  var sc=computeScore(res,modForScore(w,res,oppRes));
  w.hand=sh;w.played=sp;
  return sc;
}
/* 把技能效果套在快照上，用的是和真人完全相同的规则 */
function simUseSkill(w,sk){
  var key=sk.key,cfg=C.skills[key];
  if(TARGETED[key])applyTargeted(w,key,aiTargets(w,key,cfg));
  else applyInstant(w,key,cfg);
  var i=w.skHand.indexOf(sk);if(i>=0)w.skHand.splice(i,1);
}

/* ---------- 换牌：枚举保留哪几张，抽样算期望分 ---------- */
function bitsOf(x){var c=0;while(x){c+=x&1;x>>=1;}return c;}
function randomDraw(k){
  var pool=G.pokerDraw.slice();
  if(pool.length<k)pool=pool.concat(G.pokerDiscard.slice());
  if(pool.length<k)return null;
  var out=[];
  for(var i=0;i<k;i++){
    var j=Math.floor(rnd()*(pool.length-i));
    out.push(pool[j]);
    pool[j]=pool[pool.length-1-i];
  }
  return out;
}
function keepEV(w,mask,samples){
  var kept=[],k=0;
  w.hand.forEach(function(c,i){if(mask>>i&1)kept.push(c);else k++;});
  if(k===0)return scoreOfHand(w,cpHand(kept));
  var sum=0,got=0;
  for(var s=0;s<samples;s++){
    var drew=randomDraw(k);
    if(!drew)break;
    sum+=scoreOfHand(w,cpHand(kept).concat(drew.map(cpCard)));
    got++;
  }
  return got?sum/got:scoreOfHand(w,cpHand(kept));
}
function aiDiscard(){
  var w=G.ai,p=G.aiP||aiProfile(G.agg||0),n=w.hand.length;
  if(n<1)return;
  var total=1<<n,bestMask=0,bestEV=-1e9;
  for(var mask=0;mask<total;mask++){
    var ev=keepEV(w,mask,p.samples);
    if(ev>bestEV){bestEV=ev;bestMask=mask;}
  }
  /* 难度自带的失误率：保留张数不变，但故意挑错牌 */
  if(p.noise>0&&rnd()<p.noise){
    var same=[];
    for(var m2=0;m2<total;m2++)if(bitsOf(m2)===bitsOf(bestMask))same.push(m2);
    bestMask=same[Math.floor(rnd()*same.length)];
  }
  var swap=[];
  for(var i=0;i<n;i++)if(!(bestMask>>i&1))swap.push(i);
  swap.sort(function(a,b){return b-a;});
  swap.forEach(function(i){var c=w.hand.splice(i,1)[0];toDiscard(c);});
  for(var d=0;d<swap.length;d++)w.hand.push(drawOne(w));
}

/* ---------- 技能：先推演收益，再结合血量局势决定 ---------- */
/* 改牌类技能挑目标：枚举组合，取投影得分最高的那组 */
function aiTargets(w,key,cfg){
  var pickN=(key==='midas'||key==='manta')?1:(cfg.pick||2);
  var n=w.hand.length,combos=[];
  if(n<=0)return [];
  (function rec(start,acc){
    if(acc.length===pickN){combos.push(acc.slice());return;}
    for(var i=start;i<n;i++){acc.push(i);rec(i+1,acc);acc.pop();}
  })(0,[]);
  if(!combos.length)return [];
  var best=combos[0],bs=-1e9;
  combos.forEach(function(combo){
    var copies=cpHand(w.hand);
    mutateHand(copies,key,combo,cfg);
    var sc=scoreOfHand(w,copies);
    if(sc>bs){bs=sc;best=combo;}
  });
  return best;
}
/* 弱 AI 用“够用就行”的选牌法，不枚举最优 */
function naiveTargets(w,key,cfg){
  if(!w.hand.length)return [];
  if(key==='midas'){var c0=w.hand.slice().sort(function(a,b){return a.rank-b.rank;})[0];return [w.hand.indexOf(c0)];}
  if(key==='manta'){var c1=w.hand.slice().sort(function(a,b){return b.rank-a.rank;})[0];return [w.hand.indexOf(c1)];}
  return w.hand.slice().sort(function(a,b){return a.rank-b.rank;}).slice(0,cfg.pick||2)
    .map(function(c){return w.hand.indexOf(c);});
}
function chooseTargets(w,key,cfg){
  return (G.aiP&&G.aiP.iq>=0.6)?aiTargets(w,key,cfg):naiveTargets(w,key,cfg);
}
/* 保命 / 资源类技能折算成分值，和牌面收益同量纲比较 */
function skillSituation(w,key){
  var missing=w.maxHp-w.hp;
  switch(key){
    case 'aegis':      return w.hp<=2?150:(w.hp<=3?70:25);
    case 'bkb':        return 45;
    case 'headdress':  return missing>0?45:10;
    case 'lifepotion': return missing>=1?55:(missing>0?25:8);
    case 'ring':       return 30;
    case 'bloodstone': return 35;
    case 'deso':       return 28;
    case 'conjure':    return 26;
    case 'refresh':    return 12;
    default:           return 0;
  }
}
function aiSkillValue(w,sk,plan){
  var st=snapState(w);
  plan.forEach(function(p){simUseSkill(w,p);});
  var before=scoreOfHand(w,cpHand(w.hand));
  simUseSkill(w,sk);
  var after=scoreOfHand(w,cpHand(w.hand));
  loadState(w,st);
  return (after-before)+skillSituation(w,sk.key);
}
var aiPlanVer=0;
function aiSkillPlan(){
  if(G.phase!=='skill'||G.over)return;
  var ver=++aiPlanVer,w=G.ai,p=G.aiP||aiProfile(G.agg||0),plan=[],gain=0;
  var opp=(w===G.ai)?G.p:G.ai;
  /* 血量落后就拼一点，领先就稳一手 */
  var thr=p.thr*(w.hp<=opp.hp-1.5?0.6:(w.hp>=opp.hp+1.5?1.35:1));
  var limit=Math.min(p.maxSkill,C.maxSkillsPerRound);
  for(var step0=0;step0<limit;step0++){
    var best=null,bv=-1e9;
    w.skHand.forEach(function(sk){
      if(plan.indexOf(sk)>=0)return;
      var v=aiSkillValue(w,sk,plan);
      if(v>bv){bv=v;best=sk;}
    });
    if(!best||bv<thr)break;
    plan.push(best);gain+=bv;
  }
  if(plan.length)addLog('AI 分析：准备 '+plan.map(function(sk){return SKILL_DEFS[sk.key].name;}).join(' + ')+
    '（预计收益 '+Math.round(gain)+' 分）');
  var step=0;
  setTimeout(function next(){
    if(ver!==aiPlanVer)return;
    if(G.paused){setTimeout(next,300);return;}
    if(G.phase!=='skill'||G.over)return;
    if(step>=plan.length||w.usedSkills.length>=C.maxSkillsPerRound)return;
    var sk=plan[step++];
    if(sk&&w.skHand.indexOf(sk)>=0)aiUseSkill(w,sk);
    setTimeout(next,650);
  },200);
}
function aiUseSkill(w,sk){
  if(!sk||!sk.key)return;
  var key=sk.key,cfg=C.skills[key];
  w.pendingMod=w.pendingMod||freshMod();
  if(TARGETED[key])applyTargeted(w,key,chooseTargets(w,key,cfg));
  else applyInstant(w,key,cfg);
  var i=w.skHand.indexOf(sk);if(i>=0){w.skHand.splice(i,1);w.skDiscard.push(sk);}
  w.usedSkills.push(key);SFX.skill();renderAll();
}

/* ---------------- 亮牌结算 ---------------- */
function scoredCards(w,skipSkills){
  return w.played.map(function(c){
    var copy={suit:c.suit,rank:c.rank,origSuit:c.origSuit,origRank:c.origRank,uid:c.uid};
    if(!skipSkills&&w.pendingMod&&w.pendingMod.flags.magicStick)copy.suit=SUIT_RED[c.suit]?'R':'B';
    return copy;
  });
}
function buildMod(w,res,skipSkills,oppRes){
  var m=w.pendingMod?w.pendingMod:freshMod();
  if(!skipSkills){
    if(m.flags.phase&&(res.key==='pair'||res.key==='high'))m.ptsMult*=C.skills.phase.ptsMult;
    if(m.flags.drum&&res.key==='twoPair')m.totalAdd+=C.skills.drum.totalBonus;
    if(m.flags.shiva&&res.level>=C.skills.shiva.minLevel)m.totalAdd+=C.skills.shiva.totalBonus;
    if(m.flags.dagon)m.ptsAdd+=(res.key==='pair'||res.key==='twoPair')?
      C.skills.dagon.ptsAddMulti:C.skills.dagon.ptsAdd;
    if(m.flags.circlet)m.ptsAdd+=C.skills.circlet.perCard*res.usedIdx.length;
    if(m.flags.veil&&oppRes&&res.level<oppRes.level)m.ptsAdd+=C.skills.veil.ptsAdd;
    if(m.flags.bfury){
      var mx=0;res.usedIdx.forEach(function(i){mx=Math.max(mx,w.played[i].rank);});m.ptsAdd+=mx;
    }
    if(m.flags.butterfly&&rnd()<C.skills.butterfly.chance)m.totalMult*=C.skills.butterfly.totalMult;
  }
  if(w.hero==='juggernaut'&&(res.key==='high'||res.key==='pair'||res.key==='three'))
    m.ptsAdd+=C.heroes.juggernaut.lowBonus;
  if(w.hero==='lich'&&(res.key==='high'||res.key==='pair'||res.key==='twoPair')
     &&rnd()<C.heroes.lich.frost)m.baseAdd+=C.heroes.lich.frostBonus;
  m.permaBase=w.permBase;
  return m;
}
function resolveReveal(){
  var p=G.p,ai=G.ai;
  var pSkip=!!(ai.pendingMod&&ai.pendingMod.flags.bkb);
  var aiSkip=!!(p.pendingMod&&p.pendingMod.flags.bkb);
  var pScoreCards=scoredCards(p,pSkip),aiScoreCards=scoredCards(ai,aiSkip);
  var pRes=evaluateHand(pScoreCards),aiRes=evaluateHand(aiScoreCards);
  p.playedRes=pRes;ai.playedRes=aiRes;
  var pMod=buildMod(p,pRes,pSkip,aiRes),aiMod=buildMod(ai,aiRes,aiSkip,pRes);
  var pScore=computeScore(pRes,pMod),aiScore=computeScore(aiRes,aiMod);
  /* 不再把无效牌抽走：五张牌都留在对战区，参与计分的保持原样，
     没参与计分的变暗，一眼看出哪些牌有效、哪些白出 */
  function revealRow(rowId,w,res){
    var z=$(rowId);z.innerHTML='';
    w.played.forEach(function(c,i){
      var bad=res.usedIdx.indexOf(i)<0;
      z.insertAdjacentHTML('beforeend',pcardHTML(c,{size:'mid',dim:bad}));
    });
  }
  revealRow('pBattleCards',p,pRes);
  revealRow('aiBattleCards',ai,aiRes);
  $('pBattleScore').textContent=pScore;$('aiBattleScore').textContent=aiScore;
  SFX.reveal();
  if(pRes.level>=7)$('pBattleCards').querySelectorAll('.pcard').forEach(function(el){el.classList.add('bigpop');});
  if(aiRes.level>=7)$('aiBattleCards').querySelectorAll('.pcard').forEach(function(el){el.classList.add('bigpop');});
  addLog('你：'+pRes.name+' '+pScore+' ｜ AI：'+aiRes.name+' '+aiScore);

  var winner=null,loser=null;
  if(pScore>aiScore){winner=p;loser=ai;}
  else if(aiScore>pScore){winner=ai;loser=p;}
  else if(pRes.level===aiRes.level){
    if(p.hero==='chaosKnight'&&rnd()<C.heroes.chaosKnight.chaos){winner=p;loser=ai;}
    else if(ai.hero==='chaosKnight'&&rnd()<C.heroes.chaosKnight.chaos){winner=ai;loser=p;}
  }
  var br=$('battleResult');br.style.display='block';
  function queueHeaddress(w){
    if(w.pendingMod&&w.pendingMod.flags.headdress)w.headdressPending+=C.skills.headdress.heal;
  }
  if(!winner){br.textContent='平局，双方不扣血';br.style.background='#0008';br.style.color='#cfe8d2';
    queueHeaddress(p);queueHeaddress(ai);renderAll();afterRound();return;}
  br.textContent=winner===p?'你 赢 得 本 局':'AI 赢 得 本 局';
  br.style.color=winner===p?'#8fe08a':'#ff9a8a';

  var baseDmg=1;
  var f=loser.pendingMod?loser.pendingMod.flags:null;
  if(f&&f.aegis){baseDmg=0;toast((loser===p?'你':'AI')+' 的不朽之守护免伤');}
  if(baseDmg>0&&loser.hero==='deathKnight'&&rnd()<C.heroes.deathKnight.pact)baseDmg=C.heroes.deathKnight.pactDmg;
  if(loser.armletPending)baseDmg+=C.skills.armlet.backfire;
  if(baseDmg>0&&loser.poison>=C.heroes.viper.toxThreshold){
    baseDmg+=C.heroes.viper.toxDmg;loser.poison=0;poisonFX();}
  renderAll();
  function animateDamage(w,dmg,cb){hurtFX(w,function(){
    w.hp=Math.round((w.hp-dmg)*100)/100;renderAll();if(cb)cb();
  });}
  function finishWinnerEffects(){
    if(winner.hero==='viper')loser.poison+=C.heroes.viper.layersPerWin;
    if(winner.hero==='treant'&&winner.healsTotal<C.heroes.treant.maxHeals&&winner.hp<winner.maxHp){
      winner.hp=Math.min(winner.maxHp,winner.hp+C.heroes.treant.heal);
      winner.healsTotal=Math.round((winner.healsTotal+C.heroes.treant.heal)*100)/100;
    }
    if(loser.hero==='antiMage'&&loser.skHand.length<skillCap(loser)){
      for(var a=0;a<C.heroes.antiMage.skillOnLoss&&loser.skHand.length<skillCap(loser);a++)
        loser.skHand.push(drawSkill(loser));
    }
    queueHeaddress(winner);queueHeaddress(loser);
    if(winner.pendingMod&&winner.pendingMod.flags.bloodstone)
      winner.bloodstonePending+=C.skills.bloodstone.extraSkill;
    if(winner.pendingMod&&winner.pendingMod.flags.deso)
      winner.permBase+=C.skills.deso.permaBase;
    renderAll();
    if(loser.hp<=0)endGame(winner===p);else afterRound();
  }
  function checkAfterBaseDamage(){
    if(loser.hp<=0){endGame(winner===p);return;}
    if(baseDmg>0&&winner.hero==='phantomAssassin'&&!winner.critUsed&&rnd()<C.heroes.phantomAssassin.crit&&loser.hp>0){
      animateDamage(loser,C.heroes.phantomAssassin.critDmg,function(){winner.critUsed=true;finishWinnerEffects();});
    }else finishWinnerEffects();
  }
  if(baseDmg>0)animateDamage(loser,baseDmg,checkAfterBaseDamage);else checkAfterBaseDamage();
}
function afterRound(){
  G.busy=true;
  setTimeout(function(){
    if(G.over)return;
    G.p.played.forEach(toDiscard);G.ai.played.forEach(toDiscard);
    $('pBattleCards').innerHTML='';$('aiBattleCards').innerHTML='';
    $('pBattleScore').textContent='-';$('aiBattleScore').textContent='-';
    $('battleResult').style.display='none';
    G.busy=false;startRound();
  },4600);
}

/* ---------------- 结束 ---------------- */
function endGame(pw){
  G.over=true;G.phase='over';stopTimer();G.busy=false;
  if(pw){
    SFX.win();
    var mk=G.diff==='easy'?'bronze':G.diff==='normal'?'silver':'gold';
    var pay={};pay[mk]=true;
    try{if(window.SiteMedals)SiteMedals.unlock('poker',pay);}catch(e){}
    setTimeout(function(){
      openOverlay('<h2>胜利！</h2><p style="text-align:center;font-size:15px">你击败了 '+
        ({easy:'简单',normal:'普通',hard:'困难'}[G.diff])+' AI，获得 <b>'+
        ({bronze:'铜牌',silver:'银牌',gold:'金牌'}[mk])+'</b></p>'+
        '<p style="text-align:center">共经历 '+G.round+' 个回合。</p>',
        [['返回主菜单',showStartScreen],['再来一局',showStartScreen]]);
    },1200);
  } else {
    SFX.lose();
    setTimeout(function(){
      openOverlay('<h2>战败…</h2><p style="text-align:center">调整策略，再来一局吧。</p>',
        [['返回主菜单',showStartScreen],['再来一局',showStartScreen]]);
    },1200);
  }
}

/* ---------------- 特效 ---------------- */
function flash(color){
  var f=$('flash');f.style.transition='none';f.style.background=color;f.style.opacity=.4;
  setTimeout(function(){f.style.transition='opacity .5s';f.style.opacity=0;},30);
}
function hurtFX(w,cb){
  SFX.hurt();
  var card=(w===G.p?$('pHeroZone'):$('aiHeroZone')).querySelector('.hcard');
  if(card){
    card.classList.remove('hurt');void card.offsetWidth;card.classList.add('hurt');
    var old=card.querySelector('.claw');if(old)old.remove();
    var claw=document.createElement('div');claw.className='claw';
    claw.innerHTML='<i></i><i></i><i></i>';card.appendChild(claw);
    setTimeout(function(){card.classList.remove('hurt');claw.remove();if(cb)cb();},1000);
  }else setTimeout(function(){if(cb)cb();},1000);
  /* 掉血不再全屏闪红：保留英雄卡抖动 + 爪痕的局部反馈 */
}
function poisonFX(){
  for(var i=0;i<14;i++){
    var pt=document.createElement('div');pt.className='particle';
    pt.style.left='50%';pt.style.top='40%';pt.style.background='#4aff6a';
    $('fxLayer').appendChild(pt);
    var x=0,y=0;
    var an=setInterval(function(){x+=(Math.random()*10-5);y-=Math.random()*6+2;
      pt.style.transform='translate('+x+'px,'+y+'px)';},50);
    setTimeout(function(){clearInterval(an);pt.remove();},800);
  }
}

var overlayOpen=null;
function openOverlay(html,buttons){
  closeOverlay();
  var ov=document.createElement('div');ov.className='overlay';
  var m=document.createElement('div');m.className='modal';m.innerHTML=html;
  if(buttons){
    var br=document.createElement('div');br.className='btnrow';
    buttons.forEach(function(b){
      var btn=document.createElement('button');btn.className='mbtn'+(b[2]?' gold':'');
      btn.textContent=b[0];btn.onclick=b[1];br.appendChild(btn);});
    m.appendChild(br);
  }
  ov.appendChild(m);document.body.appendChild(ov);overlayOpen=ov;
}

function togglePause(){
  if(!G||G.over||G.phase==='hero')return;
  G.paused=!G.paused;
  if(G.paused)pauseMenu();else closeOverlay();
}

/* ---------------- 开局 ---------------- */
var chosenDiff='normal';
function showStartScreen(){
  closeOverlay();stopTimer();
  freshGame(chosenDiff);renderAll();
  openOverlay('<h2>魔兽扑克 · 选择 AI 难度</h2>'+
  '<div class="diffRow">'+
  '<button class="diffBtn" data-d="easy">简单</button>'+
  '<button class="diffBtn sel" data-d="normal">普通</button>'+
  '<button class="diffBtn" data-d="hard">困难</button></div>'+
  '<p style="text-align:center">击败简单 AI = 铜牌　·　普通 = 银牌　·　困难 = 金牌</p>',
  [['下一步：选择英雄',startHeroPick,true]]);
  document.querySelectorAll('.diffBtn').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.diffBtn').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');chosenDiff=b.dataset.d;
    };
  });
}
function random4(){
  var k=HERO_DEFS.map(function(h){return h.key;});shuffle(k);return k.slice(0,4);
}
/* 英雄强度表：AI 选人时用，越强的档位越会挑（弱档位随机选） */
var HERO_POWER={deathKnight:7,juggernaut:7.5,viper:7.2,phantomAssassin:6.6,antiMage:6.2,
  archMage:6.8,treant:7.4,chaosKnight:6,lich:6.6,bloodMage:6.4};
function aiPickHero(pool){
  var p=G.aiP||aiProfile(G.agg||0);
  if(rnd()>p.iq)return pick(pool);
  return pool.slice().sort(function(a,b){return HERO_POWER[b]-HERO_POWER[a];})[0];
}
var playerPool=null,aiPool=null,pickedPlayer=null;
function startHeroPick(){
  playerPool=random4();aiPool=random4();pickedPlayer=null;
  openOverlay('<h2>选择你的英雄</h2><p style="text-align:center">从 4 名英雄中选 1 名，AI 同样独立 4 选 1。</p>'+
  '<div class="pickRow" id="pickRow"></div>',
  [['确认',confirmHeroPick,true]]);
  var row=$('pickRow');
  playerPool.forEach(function(key){
    var def=HERO_DEFS.filter(function(h){return h.key===key;})[0];
    var d=document.createElement('div');d.className='pickCard';
    d.innerHTML='<canvas width="96" height="96"></canvas>'+
      '<div class="pn">'+def.name+'</div>'+
      '<div class="hhearts">'+heartsHTML(C.heroes[key].hp,C.heroes[key].hp,13,12)+'</div>';
    d.onclick=function(){
      document.querySelectorAll('.pickCard').forEach(function(x){x.classList.remove('picked');});
      d.classList.add('picked');pickedPlayer=key;
    };
    row.appendChild(d);
    PIX.draw(d.querySelector('canvas'),PORTRAITS[key].rows,PORTRAITS[key].pal);
    paintHearts(d);
    bindTip(d,def.name,'英雄被动',def.pass);
  });
}
function confirmHeroPick(){
  if(!pickedPlayer){toast('请先点选一名英雄');return;}
  var aiPick=aiPickHero(aiPool);
  setupHero(G.p,pickedPlayer);setupHero(G.ai,aiPick);
  G.pokerDraw=buildPokerDeck();
  G.p.skDraw=buildSkillDeck();G.ai.skDraw=buildSkillDeck();
  closeOverlay();
  renderAll();startRound();
}
function setupHero(w,key){w.hero=key;w.hp=C.heroes[key].hp;w.maxHp=C.heroes[key].hp;}

/* ---------------- 按钮 / 键盘 ---------------- */
$('pauseBtn').onclick=togglePause;
$('helpBtn').onclick=function(){openOverlay(helpHTML(),[['关闭',closeOverlay,true]]);};
$('handBtn').onclick=function(){openOverlay(handTableHTML(),[['关闭',closeOverlay,true]]);};
$('surrBtn').onclick=function(){
  openOverlay('<h2>投降 / 重新开始？</h2><p style="text-align:center">当前对局将结束并返回主菜单。</p>',
    [['取消',closeOverlay],['确认投降',function(){G.over=true;stopTimer();showStartScreen();},true]]);
};
$('logBtn').onclick=function(){
  var rows=logs.slice(-40).map(function(l){return '<li>'+l.m+'</li>';}).join('')||'<li>暂无日志</li>';
  openOverlay('<h2>游戏日志</h2><ul>'+rows+'</ul>',[['关闭',closeOverlay,true]]);
};
$('discardBtn').onclick=function(){doDiscard(false);};
$('playBtn').onclick=function(){requestPlay(false);};
$('sortBtn').onclick=function(){G.sortMode=G.sortMode===0?1:0;sortPlayerHand();SFX.discard();renderAll();};
$('discardSkillBtn').onclick=confirmDiscardSkills;
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='button'||t==='input')return;
    e.preventDefault();togglePause();
  }
});

/* ---------------- 测试钩子 ---------------- */
window.__pokerTest={
  CFG:POKER_CFG,evaluateHand:evaluateHand,computeScore:computeScore,
  makeCard:makeCard,freshMod:freshMod,buildMod:buildMod,setupHero:setupHero,
  G:function(){return G;}
};

/* ---------------- 启动 ---------------- */
showStartScreen();
</script>
</body>
</html>
