<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CQ的网站</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%232f5d3a'/%3E%3Crect x='4.2' y='6.6' width='1.5' height='3.4' fill='%239bca4b'/%3E%3Crect x='3.2' y='7.6' width='3.5' height='1.4' fill='%239bca4b'/%3E%3Ccircle cx='10.6' cy='8' r='0.85' fill='%23e2503d'/%3E%3Ccircle cx='12.2' cy='9.8' r='0.85' fill='%23f0b429'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ============ 对战消消乐 专属布局 ============ */
    .battle-page { max-width: 1000px; }
    .battle-hud {
      display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .battle-hud .hud-scores { display: flex; gap: 10px; }
    .battle-hud .score-box { min-width: 96px; }
    .battle-hud .hud-spacer { flex: 1; }
    .battle-wrap {
      position: relative;
      display: flex; gap: 16px; align-items: flex-start; justify-content: center;
    }
    .field-col { flex: 0 0 auto; }
    #fieldCanvas {
      width: 300px; height: 650px; display: block;
      border: var(--border); border-radius: 6px;
      box-shadow: var(--shadow-sm);
      background: #a9ce7f;
      touch-action: manipulation;
    }
    .match-col { flex: 0 0 auto; width: 480px; max-width: calc(100vw - 350px); }
    .match-wrap { position: relative; }
    .hud-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .hud-actions .pixel-btn { min-width: 84px; justify-content: center; }
    .restart-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    /* 难度选择弹窗 */
    .diff-list { display: flex; flex-direction: column; gap: 12px; margin: 18px 0 4px; }
    .diff-list .pixel-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 14px 16px; text-align: left;
    }
    .diff-list .diff-name { font-family: var(--font-pixel); font-size: 13px; }
    .diff-list .diff-desc { font-family: var(--font-body); font-size: 12px; opacity: .85; line-height: 1.5; }
    .diff-list .pixel-btn.current { background: var(--gb-mid); color: #fbfcf4; }
    .diff-cancel { display: flex; justify-content: center; margin-top: 14px; }
    #matchCanvas {
      width: 100%; height: auto; aspect-ratio: 1 / 1; display: block;
      border: var(--border); border-radius: 6px;
      box-shadow: var(--shadow-sm);
      background: #eef2e2;
      touch-action: manipulation;
    }
    .shop {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-top: 12px;
    }
    .shop-btn {
      position: relative;
      background: var(--paper); border: var(--border); border-radius: 6px;
      box-shadow: 3px 3px 0 var(--ink);
      padding: 9px 4px 7px;
      display: grid; justify-items: center; gap: 4px;
      font-family: inherit; cursor: pointer; color: var(--ink);
      transition: transform .08s, box-shadow .08s;
    }
    .shop-key {
      position: absolute; top: -9px; right: -9px; z-index: 2;
      min-width: 21px; height: 21px; padding: 0 4px; box-sizing: border-box;
      display: grid; place-items: center;
      background: var(--ink); color: #fbfcf4;
      font-family: var(--font-pixel); font-size: 9px; line-height: 1;
      border: 2px solid var(--paper); border-radius: 50%;
      box-shadow: 2px 2px 0 rgba(31,45,32,.35);
    }
    .shop-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
    .shop-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .shop-btn.poor { opacity: .42; cursor: not-allowed; box-shadow: 1px 1px 0 var(--ink); }
    .shop-btn .shop-ico { width: 28px; height: 28px; display: grid; place-items: center; }
    .shop-btn .shop-name { font-weight: 900; font-size: 13px; }
    .shop-btn .shop-cost {
      font-family: var(--font-pixel); font-size: 10px; color: var(--gb-dark);
      display: flex; align-items: center; gap: 4px;
    }
    .shop-btn .shop-cost::before {
      content: ""; width: 9px; height: 9px; border-radius: 50%;
      background: var(--gold); border: 1.5px solid var(--ink);
    }
    /* 能量条 */
    .energy-bar {
      position: relative; margin-top: 12px; height: 30px;
      border: var(--border); border-radius: 6px; background: #dde5cf;
      box-shadow: 3px 3px 0 var(--ink); overflow: hidden;
      display: flex; align-items: center;
    }
    .energy-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: #9bca4b;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.35);
      transition: width .15s ease-out;
    }
    .energy-tag, .energy-num { position: relative; z-index: 1; color: var(--ink); }
    .energy-tag { padding-left: 12px; font-family: var(--font-pixel); font-size: 9px; letter-spacing: .5px; }
    .energy-num { margin-left: auto; padding-right: 12px; font-weight: 900; font-size: 14px; }
    /* 暂停遮罩 */
    .pause-mask {
      position: absolute; inset: 0; z-index: 20; border-radius: 6px;
      background: rgba(31,45,32,.72); color: #fbfcf4;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      text-align: center;
    }
    .pause-mask.show { display: flex; }
    .pause-mask .pm-title { font-family: var(--font-pixel); font-size: 20px; }
    .pause-mask .pm-sub { font-size: 14px; opacity: .85; }
    @media (max-width: 860px) {
      .battle-wrap { gap: 10px; }
      .field-col { flex: 0 0 25vw; }
      #fieldCanvas { width: 100%; height: auto; aspect-ratio: 300 / 650; }
      .match-col { flex: 1 1 auto; max-width: none; }
      .shop { grid-template-columns: repeat(2, 1fr); }
      .hud-actions { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .hud-actions .pixel-btn { min-width: 0; min-height: 40px; padding: 9px 10px; font-size: 10px; line-height: 1.2; }
      .battle-hud .score-box { min-width: 78px; padding: 8px 10px; }
      .energy-bar { height: 26px; }
      .energy-num { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- ================= 顶部导航 ================= -->
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        <span>CHRIST'S WORLD</span>
      </a>
      <nav class="nav-links">
        <a class="nav-link" href="../index.html">首页</a>
        <a class="nav-link current" href="../categories/games.html">游戏</a>
      </nav>
    </div>
  </header>

  <!-- ================= 游戏主体 ================= -->
  <main class="container battle-page">
    <div class="page-head" style="max-width:100%;">
      <a class="back-link" href="../categories/games.html">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        返回游戏列表
      </a>
      <h1 class="page-title">对战消消乐</h1>
      <p class="page-sub">右边消除攒能量、自动出兵，左边蓝方士兵会自动寻敌并打上红色敌方基地。空格暂停，R 键重置棋盘，数字键 1-4 快速买兵。</p>
    </div>

    <!-- 计分板 -->
    <div class="battle-hud">
      <div class="hud-scores">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span class="value" id="hudScore">0</span>
        </div>
      </div>
      <div class="hud-spacer"></div>
      <div class="hud-actions">
        <button class="pixel-btn secondary" id="btnDifficulty" type="button">难度：普通</button>
        <button class="pixel-btn secondary" id="btnPause" type="button">暂停</button>
        <button class="pixel-btn secondary" id="btnReshuffle" type="button">重置 R</button>
        <button class="pixel-btn" id="btnRestart" type="button">重新开始</button>
      </div>
    </div>

    <div class="battle-wrap">
      <!-- 左：竖向战场（我方蓝基地在下，敌方红基地在上） -->
      <div class="field-col">
        <canvas id="fieldCanvas" width="300" height="650"></canvas>
      </div>

      <!-- 右：消消乐 + 购买条 -->
      <div class="match-col">
        <div class="match-wrap">
          <canvas id="matchCanvas" width="480" height="480"></canvas>
        </div>
        <div class="shop" id="shop">
          <button class="shop-btn" data-unit="spearman" type="button">
            <span class="shop-key">1</span>
            <span class="shop-ico">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3a6ea5" stroke-width="2" stroke-linecap="square">
                <path d="M5 21 L17 5"/><path d="M17 5 L20 2 L18 7 Z" fill="#3a6ea5"/>
              </svg>
            </span>
            <span class="shop-name">长矛手</span>
            <span class="shop-cost">30</span>
          </button>
          <button class="shop-btn" data-unit="archer" type="button">
            <span class="shop-key">2</span>
            <span class="shop-ico">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5a8f3c" stroke-width="2" stroke-linecap="square">
                <path d="M7 3 Q16 12 7 21"/><path d="M4 12 L20 8 L16 12 L20 16"/>
              </svg>
            </span>
            <span class="shop-name">弓箭手</span>
            <span class="shop-cost">45</span>
          </button>
          <button class="shop-btn" data-unit="mage" type="button">
            <span class="shop-key">3</span>
            <span class="shop-ico">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a5a9e" stroke-width="2" stroke-linecap="square">
                <path d="M6 10 L12 3 L18 10 Z" fill="#8a5a9e"/><path d="M17 10 V21"/><circle cx="17" cy="8" r="2" fill="#f0b429"/>
              </svg>
            </span>
            <span class="shop-name">法师</span>
            <span class="shop-cost">65</span>
          </button>
          <button class="shop-btn" data-unit="catapult" type="button">
            <span class="shop-key">4</span>
            <span class="shop-ico">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7a5230" stroke-width="2" stroke-linecap="square">
                <path d="M4 14 L15 14 L12 8"/><rect x="3" y="14" width="13" height="5" fill="#7a5230"/>
                <circle cx="7" cy="20" r="2.4"/><circle cx="15" cy="20" r="2.4"/>
              </svg>
            </span>
            <span class="shop-name">投石车</span>
            <span class="shop-cost">90</span>
          </button>
        </div>
        <div class="energy-bar" id="energyBar" title="1 分 = 1 能量，上限 500；每累计 20 分自动派出 1 名刀兵，购买兵种消耗能量">
          <div class="energy-fill" id="energyFill"></div>
          <span class="energy-tag">ENERGY</span>
          <span class="energy-num" id="hudEnergy">0 / 500</span>
        </div>
      </div>
      <div class="pause-mask" id="pauseMask">
        <div class="pm-title">已暂停</div>
        <div class="pm-sub">按空格键继续</div>
      </div>
    </div>
  </main>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <span class="brand-mark" style="width:22px;height:22px;box-shadow:none;">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="4.2" y="6.2" width="1.5" height="3.6" fill="#9bca4b"/>
            <rect x="3.1" y="7.25" width="3.7" height="1.5" fill="#9bca4b"/>
            <circle cx="10.4" cy="7.8" r="0.9" fill="#e2503d"/>
            <circle cx="12.3" cy="9.8" r="0.9" fill="#f0b429"/>
          </svg>
        </span>
        CHRIST'S WORLD
      </span>
    </div>
  </footer>

  <script src="../js/common.js"></script>
  <script>
  /* ============================================================
     对战消消乐：消消乐（右）+ 竖向推进战场（左）
     ============================================================ */
  (function () {
    /* ---------- 画布 ---------- */
    var fieldCv = document.getElementById('fieldCanvas');
    var fctx = fieldCv.getContext('2d');
    var matchCv = document.getElementById('matchCanvas');
    var mctx = matchCv.getContext('2d');
    var FW = 300, FH = 650;          // 战场内部分辨率（改尺寸要同步 HTML/CSS，见 README）
    var MS = 480, N = 8, CELL = MS / N;  // 消消乐 8×8
    // 基地 / 战线位置（FH 改了会自动跟随）
    var BASE_W = 150, BASE_H = 24;            // 基地宽 / 高（压扁，对战区域更长）
    var BASE_Y = { enemy: 20, ally: FH - 20 };
    var STOP_Y = { enemy: 46, ally: FH - 46 };
    var SPAWN_Y = { enemy: 50, ally: FH - 50 };

    var hudScore = document.getElementById('hudScore');
    var energyFill = document.getElementById('energyFill');
    var hudEnergy = document.getElementById('hudEnergy');
    var pauseMask = document.getElementById('pauseMask');
    var btnPause = document.getElementById('btnPause');
    var btnReshuffle = document.getElementById('btnReshuffle');
    function setPaused(v) {
      if (!G) { return; }
      G.paused = v;
      pauseMask.classList.toggle('show', v);
      if (btnPause) { btnPause.textContent = v ? '继续' : '暂停'; }
    }
    /* ---------- 难度：普通=敌方出兵量 x1.1，困难=x1.65（普通基础上再 x1.5） ---------- */
    var DIFFS = {
      normal: { mult: 1.1, label: '普通', name: '普通难度', desc: '傻子都能通关' },
      hard:   { mult: 1.65, label: '困难', name: '困难难度', desc: '在普通难度基础上 +50%' }
    };
    var difficulty = 'normal';
    try {
      var savedDiff = localStorage.getItem('battlematch-difficulty');
      if (savedDiff && DIFFS[savedDiff]) { difficulty = savedDiff; }
    } catch (e) {}
    var btnDifficulty = document.getElementById('btnDifficulty');
    function refreshDiffButton() {
      if (btnDifficulty) { btnDifficulty.textContent = '难度：' + DIFFS[difficulty].label; }
    }
    var shopBtns = document.querySelectorAll('.shop-btn');

    /* ---------- 消消乐方块颜色（内嵌不同符号，色弱也能区分） ---------- */
    var GEM_COLORS = {
      1: { fill: '#5a8f3c', dark: '#3c6628', sym: 'circle' },
      2: { fill: '#e2503d', dark: '#a83426', sym: 'triangle' },
      3: { fill: '#f0b429', dark: '#b5801a', sym: 'diamond' },
      4: { fill: '#3a6ea5', dark: '#274c72', sym: 'square' },
      5: { fill: '#8a5a9e', dark: '#623f72', sym: 'star' },
      6: { fill: '#e08a2e', dark: '#a4621c', sym: 'cross' }
    };

    /* ---------- 兵种数值 ---------- */
    var UNITS = {
      swordsman: { hp: 70,  dmg: 9,  range: 18,  gap: 0.8,  speed: 25, r: 9,  cost: 0,  ranged: false },
      spearman:  { hp: 52,  dmg: 18, range: 34,  gap: 1.0,  speed: 27, r: 9,  cost: 30, ranged: false },
      archer:    { hp: 40,  dmg: 11, range: 175, gap: 1.1,  speed: 27, r: 9,  cost: 45, ranged: true,  projSpeed: 280, projColor: '#f4e9b8', aoe: 0 },
      mage:      { hp: 46,  dmg: 26, range: 155, gap: 1.8,  speed: 22, r: 9,  cost: 65, ranged: true,  projSpeed: 230, projColor: '#c79ae0', aoe: 28 },
      catapult:  { hp: 150, dmg: 42, range: 235, gap: 3.0,  speed: 13, r: 13, cost: 90, ranged: true,  projSpeed: 170, projColor: '#9a9a92', aoe: 42 }
    };

    /* ---------- 能量与哨兵塔参数（想改数字在这里） ---------- */
    var ENERGY_MAX = 500;        // 能量条上限
    var TOWER_INSET = FH / 6;    // 塔距基地的纵向距离（半场的 1/3）
    var TOWER_X = 26;            // 左右两座塔的 x 坐标（离边线距离）
    var TOWER = { hp: 220, dmg: 7, range: 150, gap: 1.0, projSpeed: 300, r: 13 };

    /* ---------- 平衡性数值（开发者专用：运行 tools/ 后台编辑器修改 CFG0，玩家不可见、不可改） ---------- */
    var CFG0 = {
      energyMax: 1000,
      freeStep: 20,
      seekRange: 120,
      baseHp: 2000,
      reshuffleCost: 50,
      scores: {
        three: 10,
        four: 18,
        five: 28
      },
      tower: {
        hp: 1500,
        dmg: 20,
        range: 175,
        gap: 1,
        projSpeed: 400
      },
      units: {
        swordsman: {
          cost: 0,
          hp: 100,
          dmg: 18,
          range: 15,
          gap: 1,
          speed: 25
        },
        spearman: {
          cost: 80,
          hp: 125,
          dmg: 20,
          range: 25,
          gap: 1,
          speed: 26
        },
        archer: {
          cost: 90,
          hp: 100,
          dmg: 22,
          range: 130,
          gap: 1.2,
          speed: 23,
          projSpeed: 300,
          aoe: 0
        },
        mage: {
          cost: 150,
          hp: 80,
          dmg: 30,
          range: 150,
          gap: 1.5,
          speed: 22,
          projSpeed: 240,
          aoe: 10
        },
        catapult: {
          cost: 250,
          hp: 200,
          dmg: 35,
          range: 180,
          gap: 2.5,
          speed: 20,
          projSpeed: 180,
          aoe: 20
        }
      },
      enemy: {
        baseInterval: 6,
        minInterval: 3.5,
        decay: 0.03,
        units: {
          catapult: {
            time: 40,
            chance: 0.05
          },
          mage: {
            time: 30,
            chance: 0.15
          },
          archer: {
            time: 20,
            chance: 0.35
          },
          spearman: {
            time: 15,
            chance: 0.45
          }
        }
      },
      difficulty: {
        normal: {
          mult: 1
        },
        hard: {
          mult: 1.5
        }
      },
      burn: {
        chance: 0.5,
        dps: 5,
        duration: 3
      }
    };
    var SCORE3 = 10, SCORE4 = 25, SCORE5 = 40, FREE_STEP = 20, SEEK_RANGE = 100, BASE_HP = 600;
    function applyCfgToDefs() {
      SCORE3 = CFG0.scores.three; SCORE4 = CFG0.scores.four; SCORE5 = CFG0.scores.five;
      FREE_STEP = CFG0.freeStep; SEEK_RANGE = CFG0.seekRange; BASE_HP = CFG0.baseHp;
      ENERGY_MAX = CFG0.energyMax;
      for (var ut in CFG0.units) {
        if (!UNITS[ut]) { continue; }
        for (var uk in CFG0.units[ut]) { UNITS[ut][uk] = CFG0.units[ut][uk]; }
      }
      for (var tk in CFG0.tower) { TOWER[tk] = CFG0.tower[tk]; }
      // 难度出兵倍率（标签/名称/描述保留在 DIFFS，仅数值从 CFG0 取）
      if (CFG0.difficulty && CFG0.difficulty.normal) { DIFFS.normal.mult = CFG0.difficulty.normal.mult; }
      if (CFG0.difficulty && CFG0.difficulty.hard) { DIFFS.hard.mult = CFG0.difficulty.hard.mult; }
    }
    function refreshShopCosts() {
      for (var si = 0; si < shopBtns.length; si++) {
        var st = shopBtns[si].getAttribute('data-unit');
        shopBtns[si].querySelector('.shop-cost').textContent = UNITS[st].cost;
      }
    }
    applyCfgToDefs();

    function makeTowers() {
      var arr = [];
      var ty = { enemy: BASE_Y.enemy + TOWER_INSET, ally: BASE_Y.ally - TOWER_INSET };
      ['enemy', 'ally'].forEach(function (side) {
        [TOWER_X, FW - TOWER_X].forEach(function (x) {
          arr.push({
            side: side, x: x, y: ty[side],
            hp: TOWER.hp, maxHp: TOWER.hp, cd: Math.random() * 0.5,
            isTower: true, rad: TOWER.r
          });
        });
      });
      return arr;
    }

    /* ---------- 全局状态 ---------- */
    var G = null;
    function newState() {
      return {
        time: 0, over: false, paused: false,
        score: 0, energy: 0, freeGiven: 0,
        /* 消消乐 */
        grid: [],            // grid[r][c] = {t:类型, y:浮点行}
        selected: null,
        phase: 'idle',       // idle / swap / swapback / clear / fall
        swap: null,          // {ar,ac,br,bc,t,back}
        matched: [],         // 当前消除闪烁的格 [{r,c}]
        phaseT: 0,
        fxs: [],             // 浮动得分/特效
        shards: [], drops: null,   // 棋盘重置动画
        /* 战场 */
        units: [], projectiles: [], hits: [], towers: makeTowers(),
        bases: {
          ally:  { hp: BASE_HP, maxHp: BASE_HP, y: BASE_Y.ally,  side: 'ally' },
          enemy: { hp: BASE_HP, maxHp: BASE_HP, y: BASE_Y.enemy, side: 'enemy' }
        },
        enemyTimer: 12       // 开局 12 秒准备期
      };
    }

    /* ================= 消消乐 ================= */
    function buildBoard() {
      G.grid = [];
      for (var r = 0; r < N; r++) {
        var row = [];
        for (var c = 0; c < N; c++) {
          var t;
          do {
            t = 1 + Math.floor(Math.random() * 6);
          } while (
            (c >= 2 && row[c - 1].t === t && row[c - 2].t === t) ||
            (r >= 2 && G.grid[r - 1][c].t === t && G.grid[r - 2][c].t === t)
          );
          row.push({ t: t, y: r });
        }
        G.grid.push(row);
      }
      G.selected = null; G.phase = 'idle'; G.swap = null; G.matched = []; G.wave = 0;
    }

    // 返回所有横/纵三连及以上的组（每组是 {r,c} 列表）
    function findMatches(g) {
      var groups = [];
      var scan = function (list) {
        var i = 0;
        while (i < list.length) {
          var j = i + 1;
          while (j < list.length && list[i].t && list[j].t === list[i].t) { j++; }
          if (j - i >= 3) {
            var grp = [];
            for (var k = i; k < j; k++) { grp.push(list[k].cell); }
            groups.push(grp);
          }
          i = j;
        }
      };
      var r, c;
      for (r = 0; r < N; r++) {
        var rowList = [];
        for (c = 0; c < N; c++) { rowList.push({ t: g[r][c] ? g[r][c].t : 0, cell: { r: r, c: c } }); }
        scan(rowList);
      }
      for (c = 0; c < N; c++) {
        var colList = [];
        for (r = 0; r < N; r++) { colList.push({ t: g[r][c] ? g[r][c].t : 0, cell: { r: r, c: c } }); }
        scan(colList);
      }
      return groups;
    }

    function tapCell(r, c) {
      if (G.over || G.paused || G.phase !== 'idle') { return; }
      if (!G.selected) { G.selected = { r: r, c: c }; return; }
      var s = G.selected;
      if (s.r === r && s.c === c) { G.selected = null; return; }
      if (Math.abs(s.r - r) + Math.abs(s.c - c) !== 1) { G.selected = { r: r, c: c }; return; }
      G.swap = { ar: s.r, ac: s.c, br: r, bc: c, t: 0 };
      G.phase = 'swap';
      G.selected = null;
    }

    function beginClear(groups, wave) {
      G.wave = wave;
      G.swap = null;
      var baseSum = 0, seen = {}, sx = 0, sy = 0, cnt = 0;
      for (var i = 0; i < groups.length; i++) {
        var len = groups[i].length;
        baseSum += (len <= 3 ? SCORE3 : len === 4 ? SCORE4 : SCORE5);
        for (var k = 0; k < len; k++) {
          var cell = groups[i][k], key = cell.r + '_' + cell.c;
          if (!seen[key]) {
            seen[key] = 1;
            G.matched.push(cell);
            sx += cell.c; sy += cell.r; cnt++;
          }
        }
      }
      var mul = 1 + 0.5 * (wave - 1);   // 连锁倍率：1 / 1.5 / 2 / 2.5 ...
      var gain = Math.round(baseSum * mul);
      addScore(gain, (sx / cnt + 0.5) * CELL, (sy / cnt + 0.5) * CELL, wave);
      G.phase = 'clear'; G.phaseT = 0;
    }

    function collapse() {
      for (var c = 0; c < N; c++) {
        var write = N - 1;
        for (var r = N - 1; r >= 0; r--) {
          if (G.grid[r][c]) {
            if (write !== r) {
              G.grid[write][c] = G.grid[r][c];
              G.grid[write][c].fy = r;
              G.grid[r][c] = null;
            }
            write--;
          }
        }
        for (var n = 0; n <= write; n++) {
          G.grid[write - n][c] = { t: 1 + Math.floor(Math.random() * 6), y: -1 - n, fy: -1 - n };
        }
      }
    }

    function updateMatch3(dt) {
      var i, r, c;
      for (i = G.fxs.length - 1; i >= 0; i--) {
        G.fxs[i].t += dt;
        if (G.fxs[i].t > 1) { G.fxs.splice(i, 1); }
      }
      if (!G || G.over) { return; }

      if (G.phase === 'reshuffle') { updateReshuffle(dt); return; }

      if (G.phase === 'swap' || G.phase === 'swapback') {
        G.swap.t += dt / 0.16;
        if (G.swap.t >= 1) {
          var s = G.swap, A, B;
          if (G.phase === 'swap') {
            A = G.grid[s.ar][s.ac]; B = G.grid[s.br][s.bc];
            G.grid[s.ar][s.ac] = B; G.grid[s.br][s.bc] = A;
            if (A) { A.y = s.br; } if (B) { B.y = s.ar; }
            var groups = findMatches(G.grid);
            if (groups.length) { beginClear(groups, 1); }
            else { G.phase = 'swapback'; G.swap.t = 0; }
          } else {
            A = G.grid[s.ar][s.ac]; B = G.grid[s.br][s.bc];
            G.grid[s.ar][s.ac] = B; G.grid[s.br][s.bc] = A;
            if (A) { A.y = s.br; } if (B) { B.y = s.ar; }
            G.phase = 'idle'; G.swap = null;
            checkDeadBoard();
          }
        }
      } else if (G.phase === 'clear') {
        G.phaseT += dt;
        if (G.phaseT >= 0.22) {
          for (i = 0; i < G.matched.length; i++) {
            var m = G.matched[i]; G.grid[m.r][m.c] = null;
          }
          G.matched = [];
          collapse();
          G.phase = 'fall'; G.phaseT = 0;
        }
      } else if (G.phase === 'fall') {
        G.phaseT += dt;
        var dur = 0.26, allDone = G.phaseT >= dur;
        for (r = 0; r < N; r++) {
          for (c = 0; c < N; c++) {
            var cell = G.grid[r][c];
            if (cell && cell.fy !== undefined) {
              var e = Math.min(1, G.phaseT / dur);
              cell.y = cell.fy + (r - cell.fy) * e;
              if (e >= 1) { cell.y = r; delete cell.fy; }
              else { allDone = false; }
            }
          }
        }
        if (allDone) {
          var g2 = findMatches(G.grid);
          if (g2.length) { beginClear(g2, G.wave + 1); }
          else { G.phase = 'idle'; checkDeadBoard(); }
        }
      }
    }

    function addScore(gain, x, y, wave) {
      G.score += gain;
      G.energy = Math.min(ENERGY_MAX, G.energy + gain);
      G.fxs.push({ x: x, y: y, text: '+' + gain + (wave > 1 ? ' 连锁x' + wave : ''), t: 0, big: wave > 1 });
      updateHud();
      spawnFreeSoldiers();
    }

    /* ---------- 消消乐绘制 ---------- */
    function drawGem(cx, cy, type, scale, alpha) {
      var g = GEM_COLORS[type];
      var s = CELL * 0.86 * scale;
      mctx.save();
      mctx.globalAlpha = alpha;
      mctx.translate(cx, cy);
      // 主体
      mctx.fillStyle = g.fill;
      mctx.strokeStyle = g.dark;
      mctx.lineWidth = 2.5;
      roundRect(mctx, -s / 2, -s / 2, s, s, 7);
      mctx.fill(); mctx.stroke();
      // 顶部高光
      mctx.fillStyle = 'rgba(255,255,255,.28)';
      roundRect(mctx, -s / 2 + 4, -s / 2 + 4, s - 8, s * 0.22, 4);
      mctx.fill();
      // 白色符号
      mctx.strokeStyle = 'rgba(255,255,255,.92)';
      mctx.fillStyle = 'rgba(255,255,255,.92)';
      mctx.lineWidth = 2.4;
      var q = s * 0.26;
      mctx.beginPath();
      if (g.sym === 'circle') { mctx.arc(0, 0, q, 0, Math.PI * 2); mctx.stroke(); }
      else if (g.sym === 'triangle') { mctx.moveTo(0, -q); mctx.lineTo(q, q * 0.8); mctx.lineTo(-q, q * 0.8); mctx.closePath(); mctx.stroke(); }
      else if (g.sym === 'diamond') { mctx.moveTo(0, -q); mctx.lineTo(q, 0); mctx.lineTo(0, q); mctx.lineTo(-q, 0); mctx.closePath(); mctx.stroke(); }
      else if (g.sym === 'square') { mctx.strokeRect(-q * 0.8, -q * 0.8, q * 1.6, q * 1.6); }
      else if (g.sym === 'cross') {
        mctx.moveTo(-q, -q); mctx.lineTo(q, q); mctx.moveTo(q, -q); mctx.lineTo(-q, q);
        mctx.stroke();
      } else { // star
        var i2, ang;
        for (i2 = 0; i2 < 5; i2++) {
          ang = -Math.PI / 2 + i2 * (Math.PI * 2 / 5);
          var x1 = Math.cos(ang) * q, y1 = Math.sin(ang) * q;
          ang += Math.PI / 5;
          var x2 = Math.cos(ang) * q * 0.45, y2 = Math.sin(ang) * q * 0.45;
          if (i2 === 0) { mctx.moveTo(x1, y1); } else { mctx.lineTo(x1, y1); }
          mctx.lineTo(x2, y2);
        }
        mctx.closePath(); mctx.fill();
      }
      mctx.restore();
    }

    function roundRect(ctx, x, y, w, h, rad) {
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    function drawMatch3() {
      mctx.clearRect(0, 0, MS, MS);
      // 棋盘底纹
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          mctx.fillStyle = (r + c) % 2 === 0 ? '#eef2e2' : '#e4ead4';
          mctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        }
      }
      // 交换动画的位置覆盖
      var ov = {};
      if (G.swap) {
        var s = G.swap, e = G.swap.t, p1, p2;
        if (G.phase === 'swap') {
          p1 = lerpCell(s.ar, s.ac, s.br, s.bc, e);
          p2 = lerpCell(s.br, s.bc, s.ar, s.ac, e);
          ov[s.ar + '_' + s.ac] = p1; ov[s.br + '_' + s.bc] = p2;
        } else {
          p1 = lerpCell(s.br, s.bc, s.ar, s.ac, e);
          p2 = lerpCell(s.ar, s.ac, s.br, s.bc, e);
          ov[s.ar + '_' + s.ac] = p1; ov[s.br + '_' + s.bc] = p2;
        }
      }
      var matchedSet = {};
      for (var k = 0; k < G.matched.length; k++) { matchedSet[G.matched[k].r + '_' + G.matched[k].c] = 1; }

      for (var r2 = 0; r2 < N; r2++) {
        for (var c2 = 0; c2 < N; c2++) {
          var cell = G.grid[r2][c2];
          if (!cell) { continue; }
          var key = r2 + '_' + c2;
          var cx = (c2 + 0.5) * CELL, cy = (cell.y + 0.5) * CELL;
          if (ov[key]) { cx = ov[key].x; cy = ov[key].y; }
          var scale = 1, alpha = 1;
          if (matchedSet[key] && G.phase === 'clear') {
            var p = G.phaseT / 0.22;
            scale = 1 + 0.25 * Math.sin(p * Math.PI);
            alpha = 1 - p;
          }
          drawGem(cx, cy, cell.t, scale, alpha);
        }
      }
      // 棋盘重置动画：新块掉落 + 旧块碎片
      if (G.phase === 'reshuffle') {
        if (G.drops) {
          for (var di = 0; di < G.drops.length; di++) {
            var dp = G.drops[di];
            drawGem((dp.c + 0.5) * CELL, dp.y, dp.t, 1, 1);
          }
        }
        for (var shi = 0; shi < G.shards.length; shi++) {
          var sh = G.shards[shi], gc = GEM_COLORS[sh.t];
          mctx.save();
          mctx.translate(sh.x, sh.y); mctx.rotate(sh.rot);
          mctx.fillStyle = gc.fill; mctx.strokeStyle = gc.dark; mctx.lineWidth = 1.5;
          mctx.fillRect(-sh.s / 2, -sh.s / 2, sh.s, sh.s);
          mctx.strokeRect(-sh.s / 2, -sh.s / 2, sh.s, sh.s);
          mctx.restore();
        }
      }
      // 选中框
      if (G.selected) {
        var sr = G.selected.r, sc = G.selected.c;
        mctx.strokeStyle = '#1f2d20';
        mctx.lineWidth = 4;
        mctx.strokeRect(sc * CELL + 3, sr * CELL + 3, CELL - 6, CELL - 6);
        mctx.strokeStyle = '#f0b429';
        mctx.lineWidth = 2;
        mctx.strokeRect(sc * CELL + 7, sr * CELL + 7, CELL - 14, CELL - 14);
      }
      // 浮动得分
      for (var f = 0; f < G.fxs.length; f++) {
        var fx = G.fxs[f], p2 = fx.t;
        mctx.save();
        mctx.globalAlpha = 1 - p2;
        mctx.font = (fx.big ? 'bold 30px ' : 'bold 24px ') + '"Noto Sans SC", sans-serif';
        mctx.fillStyle = fx.big ? '#d98b00' : '#2f5d3a';
        mctx.textAlign = 'center';
        mctx.lineWidth = 4; mctx.strokeStyle = 'rgba(255,255,255,.9)';
        var ty = fx.y - p2 * 34;
        mctx.strokeText(fx.text, fx.x, ty);
        mctx.fillText(fx.text, fx.x, ty);
        mctx.restore();
      }
    }

    function lerpCell(r1, c1, r2, c2, e) {
      return {
        x: (c1 + (c2 - c1) * e + 0.5) * CELL,
        y: (r1 + (r2 - r1) * e + 0.5) * CELL
      };
    }
    /* ---------- 棋盘重置（按钮 / R 键，约 3 秒惩罚动画） ----------
       free=false：玩家手动重置，消耗 reshuffleCost 能量；
       free=true ：死局自动触发的免费重置，不扣能量。 */
    function startReshuffle(free) {
      if (G.over || G.paused || G.phase !== 'idle') { return; }
      if (!free) {
        var cost = CFG0.reshuffleCost || 0;
        if (G.energy < cost) {
          showToast('能量不足，手动重置需要 ' + cost + ' 点能量');
          return;
        }
        G.energy -= cost;
        updateHud();
      }
      G.phase = 'reshuffle';
      G.phaseT = 0;
      G.selected = null; G.swap = null; G.matched = [];
      G.shards = [];
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = G.grid[r][c];
          if (!cell) { continue; }
          for (var k = 0; k < 4; k++) {
            G.shards.push({
              x: (c + 0.5) * CELL + (k % 2 ? 7 : -7),
              y: (r + 0.5) * CELL + (k > 1 ? 7 : -7),
              vx: (Math.random() - 0.5) * 140,
              vy: -40 - Math.random() * 120,
              rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 9,
              t: cell.t, s: CELL * (0.2 + Math.random() * 0.08)
            });
          }
        }
      }
      var empty = [];
      for (r = 0; r < N; r++) { empty.push(new Array(N).fill(null)); }
      G.grid = empty;
      G.drops = null;
      btnReshuffle.disabled = true;
    }

    function updateReshuffle(dt) {
      G.phaseT += dt;
      var i, r2, c2;
      // 阶段一：旧方块碎片下坠消失
      for (i = G.shards.length - 1; i >= 0; i--) {
        var sh = G.shards[i];
        sh.vy += 1900 * dt;
        sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.rot += sh.vr * dt;
        if (sh.y > MS + 40) { G.shards.splice(i, 1); }
      }
      // 阶段二：0.9 秒后生成无三连新棋盘，从顶部掉落
      if (!G.drops && G.phaseT >= 0.9) {
        var types = [];
        for (r2 = 0; r2 < N; r2++) {
          var row = [];
          for (c2 = 0; c2 < N; c2++) {
            var t;
            do {
              t = 1 + Math.floor(Math.random() * 6);
            } while (
              (c2 >= 2 && row[c2 - 1] === t && row[c2 - 2] === t) ||
              (r2 >= 2 && types[r2 - 1][c2] === t && types[r2 - 2][c2] === t)
            );
            row.push(t);
          }
          types.push(row);
        }
        G.drops = [];
        for (r2 = 0; r2 < N; r2++) {
          for (c2 = 0; c2 < N; c2++) {
            G.drops.push({
              t: types[r2][c2], r: r2, c: c2,
              y: -CELL * (0.5 + Math.random() * 1.6),
              vy: 0, start: 0.9 + c2 * 0.09 + Math.random() * 0.18,
              landed: false
            });
          }
        }
      }
      if (G.drops) {
        var allLanded = true;
        for (i = 0; i < G.drops.length; i++) {
          var d = G.drops[i];
          if (G.phaseT < d.start) { allLanded = false; continue; }
          if (!d.landed) {
            d.vy += 2600 * dt;
            d.y += d.vy * dt;
            var target = (d.r + 0.5) * CELL;
            if (d.y >= target) {
              if (d.vy > 700) { d.y = target; d.vy = -d.vy * 0.22; }
              else { d.y = target; d.landed = true; }
            }
            if (!d.landed) { allLanded = false; }
          }
        }
        // 全程约 3 秒，全部落定且满 3 秒才恢复操作
        if (allLanded && G.phaseT >= 3.0) {
          var ng = [];
          for (r2 = 0; r2 < N; r2++) {
            var nrow = [];
            for (c2 = 0; c2 < N; c2++) { nrow.push(null); }
            ng.push(nrow);
          }
          for (i = 0; i < G.drops.length; i++) {
            var dd = G.drops[i];
            ng[dd.r][dd.c] = { t: dd.t, y: dd.r };
          }
          G.grid = ng;
          G.drops = null; G.shards = [];
          G.phase = 'idle';
          btnReshuffle.disabled = false;
          checkDeadBoard();
        }
      }
    }

    // 判断当前满棋盘是否「至少存在一对相邻交换能成组」；无任何可消除组合即死局
    function hasAnyMove() {
      var r, c, r2, c2, tmp;
      for (r = 0; r < N; r++) {
        for (c = 0; c < N; c++) {
          if (!G.grid[r][c]) { return false; }   // 棋盘未满，交给落子流程
          var nbrs = [[r, c + 1], [r + 1, c]];
          for (var n = 0; n < nbrs.length; n++) {
            r2 = nbrs[n][0]; c2 = nbrs[n][1];
            if (r2 >= N || c2 >= N || !G.grid[r2][c2]) { continue; }
            // 临时交换 -> 检测 -> 换回复原
            tmp = G.grid[r][c]; G.grid[r][c] = G.grid[r2][c2]; G.grid[r2][c2] = tmp;
            var ok = findMatches(G.grid).length > 0;
            tmp = G.grid[r][c]; G.grid[r][c] = G.grid[r2][c2]; G.grid[r2][c2] = tmp;
            if (ok) { return true; }
          }
        }
      }
      return false;
    }

    // 棋盘落定后调用：若全盘无可消，自动触发一次免费重置（不扣能量）
    function checkDeadBoard() {
      if (!G || G.over || G.paused) { return; }
      if (G.phase !== 'idle') { return; }
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) { if (!G.grid[r][c]) { return; } }
      }
      if (!hasAnyMove()) { startReshuffle(true); }
    }
    /* ===MATCH3_END=== */

    /* ================= 战场 ================= */
    function spawnUnit(side, type) {
      var def = UNITS[type];
      var y = SPAWN_Y[side];
      G.units.push({
        side: side, type: type,
        x: 28 + Math.random() * (FW - 56), y: y,
        hp: def.hp, maxHp: def.hp,
        cd: Math.random() * 0.5, atkAnim: 0, walk: Math.random() * 6
      });
    }

    // 每累计 20 分自动派出一名刀兵
    function spawnFreeSoldiers() {
      var milestones = Math.floor(G.score / FREE_STEP);
      while (G.freeGiven < milestones) {
        G.freeGiven++;
        spawnUnit('ally', 'swordsman');
      }
    }

    // 敌方兵种随时间变强：按「稀有度从高到低」依次判定解锁时间与出现概率，刀兵为兜底
    var ENEMY_PRIORITY = ['catapult', 'mage', 'archer', 'spearman'];
    function enemyPick() {
      var r = Math.random();
      var eu = CFG0.enemy.units;
      for (var i = 0; i < ENEMY_PRIORITY.length; i++) {
        var t = ENEMY_PRIORITY[i];
        var e = eu[t];
        if (e && G.time >= e.time && r < e.chance) { return t; }
      }
      return 'swordsman';
    }

    // 自动寻路：缓存目标，方圆 SEEK_RANGE 内最近的敌军 / 敌方塔，离开 1.3 倍距离才换目标
    function acquireTarget(u) {
      if (u.tgt) {
        var t0 = u.tgt;
        var alive0 = t0.isTower
          ? (G.towers.indexOf(t0) >= 0 && t0.hp > 0)
          : (G.units.indexOf(t0) >= 0 && t0.hp > 0);
        if (alive0 && Math.hypot(t0.x - u.x, t0.y - u.y) <= SEEK_RANGE * 1.3) { return t0; }
        u.tgt = null;
      }
      var best = null, bd = 1e9;
      function scan(o) {
        var d = Math.hypot(o.x - u.x, o.y - u.y);
        if (d <= SEEK_RANGE && d < bd) { bd = d; best = o; }
      }
      for (var i = 0; i < G.units.length; i++) {
        if (G.units[i].side !== u.side) { scan(G.units[i]); }
      }
      for (var t = 0; t < G.towers.length; t++) {
        if (G.towers[t].side !== u.side) { scan(G.towers[t]); }
      }
      u.tgt = best;
      return best;
    }

    function fireProjectile(u, target, def, baseTarget) {
      var aim = baseTarget
        ? { x: FW / 2, y: u.side === 'ally' ? BASE_Y.enemy + 10 : BASE_Y.ally - 10 }
        : { x: target.x, y: target.y };
      G.projectiles.push({
        x: u.x, y: u.y - 4 * (u.side === 'ally' ? -1 : 1),
        side: u.side, tx: aim.x, ty: aim.y,
        target: target, base: baseTarget,
        speed: def.projSpeed, dmg: def.dmg, aoe: def.aoe,
        color: def.projColor, kind: u.type
      });
    }

    function towerFire(t, target) {
      G.projectiles.push({
        x: t.x, y: t.y + (t.side === 'enemy' ? 16 : -16),
        side: t.side, tx: target.x, ty: target.y,
        target: target, base: false,
        speed: TOWER.projSpeed, dmg: TOWER.dmg, aoe: 0,
        color: '#f4e9b8', kind: 'archer'
      });
    }

    function addHit(x, y, size, color) {
      G.hits.push({ x: x, y: y, t: 0, size: size, color: color });
    }

    function impact(p) {
      var foeSide = p.side === 'ally' ? 'enemy' : 'ally';
      var hitUnits = [];   // 本次被投射物命中的单位（用于法师附加燃烧）
      if (p.aoe > 0) {
        addHit(p.tx, p.ty, p.aoe, p.color);
        for (var i = 0; i < G.units.length; i++) {
          var o = G.units[i];
          if (o.side !== foeSide) { continue; }
          if (Math.hypot(o.x - p.tx, o.y - p.ty) <= p.aoe + UNITS[o.type].r) {
            o.hp -= p.dmg * (p.base ? 0.6 : 1);
            hitUnits.push(o);
          }
        }
        for (var ti2 = 0; ti2 < G.towers.length; ti2++) {
          var tw2 = G.towers[ti2];
          if (tw2.side !== foeSide) { continue; }
          if (Math.hypot(tw2.x - p.tx, tw2.y - p.ty) <= p.aoe + TOWER.r) {
            tw2.hp -= p.dmg * (p.base ? 0.6 : 1);
          }
        }
        if (p.base) { G.bases[foeSide].hp -= p.dmg; }
      } else {
        addHit(p.tx, p.ty, 9, '#ffe9a8');
        if (p.base) { G.bases[foeSide].hp -= p.dmg; }
        else if (p.target && p.target.hp > 0) {
          p.target.hp -= p.dmg;
          if (!p.target.isTower) { hitUnits.push(p.target); }
        }
      }
      // 法师普攻（含范围溅射）：对每个命中单位独立掷燃烧
      if (p.kind === 'mage') {
        for (var h = 0; h < hitUnits.length; h++) {
          if (Math.random() < CFG0.burn.chance) {
            hitUnits[h].burnT = CFG0.burn.duration;
            hitUnits[h].burnTick = 0;
          }
        }
      }
    }

    function updateField(dt) {
      if (G.over) { return; }

      // 敌方按时间间隔出兵（间隔随时间缩短，受难度倍率影响）
      G.enemyTimer -= dt;
      if (G.enemyTimer <= 0) {
        var ec = CFG0.enemy;
        var interval = Math.max(ec.minInterval, ec.baseInterval - G.time * ec.decay);
        G.enemyTimer = interval / DIFFS[difficulty].mult;
        spawnUnit('enemy', enemyPick());
      }

      var i, j, u, def;
      // 同方单位二维避让，避免叠在一起
      for (i = 0; i < G.units.length; i++) {
        for (j = i + 1; j < G.units.length; j++) {
          var a = G.units[i], b = G.units[j];
          if (a.side !== b.side) { continue; }
          var dx = a.x - b.x, dy = a.y - b.y;
          var d = Math.hypot(dx, dy);
          var ra = a.type === 'catapult' ? 13 : 9, rb = b.type === 'catapult' ? 13 : 9;
          var min = ra + rb - 3;
          if (d < min) {
            var nx, ny;
            if (d < 0.01) { nx = Math.random() < 0.5 ? -1 : 1; ny = 0; }
            else { nx = dx / d; ny = dy / d; }
            var push = (min - d) * 0.5;
            a.x += nx * push; a.y += ny * push;
            b.x -= nx * push; b.y -= ny * push;
            a.x = Math.max(14, Math.min(FW - 14, a.x));
            b.x = Math.max(14, Math.min(FW - 14, b.x));
            a.y = Math.max(STOP_Y.enemy - 6, Math.min(STOP_Y.ally + 6, a.y));
            b.y = Math.max(STOP_Y.enemy - 6, Math.min(STOP_Y.ally + 6, b.y));
          }
        }
      }

      for (i = 0; i < G.units.length; i++) {
        u = G.units[i]; def = UNITS[u.type];
        var dir = u.side === 'ally' ? -1 : 1;
        u.cd -= dt; u.walk += dt * 6;
        if (u.atkAnim > 0) { u.atkAnim -= dt; }
        // 燃烧 DoT：持续掉血，时间到自然熄灭（单位死亡时随其移除）
        if (u.burnT > 0) {
          u.burnT -= dt;
          u.hp -= CFG0.burn.dps * dt;
          if (u.burnT < 0) { u.burnT = 0; }
        }

        var target = acquireTarget(u);
        var foeSide = u.side === 'ally' ? 'enemy' : 'ally';
        var baseRef = G.bases[foeSide];
        var stopLine = STOP_Y[foeSide];
        var reachedBase = (u.side === 'ally' && u.y <= stopLine) ||
                          (u.side === 'enemy' && u.y >= stopLine);

        var busy = false;
        if (target) {
          var tdx = target.x - u.x, tdy = target.y - u.y;
          var td = Math.hypot(tdx, tdy);
          var trad = target.isTower ? TOWER.r : UNITS[target.type].r;
          if (td <= def.range + trad - 2) {
            // 在攻击距离内：停下攻击
            if (u.cd <= 0) {
              u.cd = def.gap; u.atkAnim = 0.18;
              if (def.ranged) { fireProjectile(u, target, def, false); }
              else { target.hp -= def.dmg; addHit(target.x, target.y, 8, '#ffffff'); }
            }
          } else {
            // 自动寻路：斜向朝敌军靠近
            u.x += (tdx / td) * def.speed * dt;
            u.y += (tdy / td) * def.speed * dt;
          }
          busy = true;
        }

        if (!busy) {
          if (reachedBase) {
            // 攻击基地
            if (u.cd <= 0) {
              u.cd = def.gap; u.atkAnim = 0.18;
              var bx = FW / 2 + (u.x - FW / 2) * 0.4, by = u.side === 'ally' ? 38 : FH - 38;
              if (def.ranged) { fireProjectile(u, null, def, true); }
              else { baseRef.hp -= def.dmg; addHit(bx, by, 10, '#ffe9a8'); }
            }
          } else {
            // 朝敌方基地推进
            u.y += dir * def.speed * dt;
          }
        }

        u.x = Math.max(14, Math.min(FW - 14, u.x));
        u.y = Math.max(STOP_Y.enemy - 6, Math.min(STOP_Y.ally + 6, u.y));
      }

      // 哨兵塔攻击射程内的敌方小兵
      for (var ti = 0; ti < G.towers.length; ti++) {
        var tw = G.towers[ti];
        tw.cd -= dt;
        var tgt = null, td = 1e9;
        for (var ei = 0; ei < G.units.length; ei++) {
          var eu = G.units[ei];
          if (eu.side === tw.side) { continue; }
          var dd = Math.hypot(eu.x - tw.x, eu.y - tw.y);
          if (dd <= TOWER.range && dd < td) { td = dd; tgt = eu; }
        }
        if (tgt && tw.cd <= 0) { tw.cd = TOWER.gap; towerFire(tw, tgt); }
      }

      // 投射物
      for (i = G.projectiles.length - 1; i >= 0; i--) {
        var p = G.projectiles[i];
        if (!p.base && p.target && p.target.hp > 0) { p.tx = p.target.x; p.ty = p.target.y; }
        var pdx = p.tx - p.x, pdy = p.ty - p.y;
        var pd = Math.hypot(pdx, pdy), step = p.speed * dt;
        if (pd <= step + 4) { impact(p); G.projectiles.splice(i, 1); }
        else { p.x += pdx / pd * step; p.y += pdy / pd * step; }
      }

      // 命中特效
      for (i = G.hits.length - 1; i >= 0; i--) {
        G.hits[i].t += dt;
        if (G.hits[i].t > 0.28) { G.hits.splice(i, 1); }
      }

      // 死亡单位
      for (i = G.units.length - 1; i >= 0; i--) {
        if (G.units[i].hp <= 0) {
          var dead = G.units[i];
          addHit(dead.x, dead.y, 12, 'rgba(60,60,50,.5)');
          G.units.splice(i, 1);
        }
      }

      // 被摧毁的哨兵塔
      for (i = G.towers.length - 1; i >= 0; i--) {
        if (G.towers[i].hp <= 0) {
          var lost = G.towers[i];
          addHit(lost.x, lost.y, 22, 'rgba(60,60,50,.6)');
          G.towers.splice(i, 1);
        }
      }

      // 胜负
      if (G.bases.enemy.hp <= 0) { G.bases.enemy.hp = 0; endGame(true); }
      else if (G.bases.ally.hp <= 0) { G.bases.ally.hp = 0; endGame(false); }
    }

    /* ---------- 战场绘制 ---------- */
    function drawField() {
      // 背景：中部草地 + 双方阵营色带
      fctx.fillStyle = '#a9ce7f';
      fctx.fillRect(0, 0, FW, FH);
      fctx.fillStyle = 'rgba(208,80,64,.22)';
      fctx.fillRect(0, 0, FW, 96);
      fctx.fillStyle = 'rgba(58,120,194,.22)';
      fctx.fillRect(0, FH - 96, FW, 96);
      // 中线虚线
      fctx.strokeStyle = 'rgba(31,45,32,.25)';
      fctx.lineWidth = 2; fctx.setLineDash([6, 6]);
      fctx.beginPath(); fctx.moveTo(0, FH / 2); fctx.lineTo(FW, FH / 2); fctx.stroke();
      fctx.setLineDash([]);

      drawBase(G.bases.enemy);
      drawBase(G.bases.ally);
      for (var ti3 = 0; ti3 < G.towers.length; ti3++) { drawTower(G.towers[ti3]); }

      var i;
      for (i = 0; i < G.units.length; i++) { drawUnit(G.units[i]); }
      for (i = 0; i < G.projectiles.length; i++) { drawProjectile(G.projectiles[i]); }
      for (i = 0; i < G.hits.length; i++) { drawHit(G.hits[i]); }
    }

    function drawBase(b) {
      var ally = b.side === 'ally';
      var cx = FW / 2, w = BASE_W, h = BASE_H;
      var top = ally ? FH - 32 : 8;
      var fill = ally ? '#3a78c2' : '#d05040';
      var dark = ally ? '#274c72' : '#8e2f24';
      var light = ally ? '#5a96d6' : '#e06a58';

      // 主体城墙
      fctx.fillStyle = fill;
      fctx.fillRect(cx - w / 2, top, w, h);
      // 砖缝纹理（横向两条 + 竖向错缝）
      fctx.strokeStyle = dark; fctx.lineWidth = 1;
      fctx.globalAlpha = 0.35;
      fctx.beginPath();
      fctx.moveTo(cx - w / 2, top + h * 0.38); fctx.lineTo(cx + w / 2, top + h * 0.38);
      fctx.moveTo(cx - w / 2, top + h * 0.72); fctx.lineTo(cx + w / 2, top + h * 0.72);
      fctx.stroke();
      fctx.globalAlpha = 0.22;
      for (var bx = cx - w / 2 + 14; bx < cx + w / 2; bx += 22) {
        fctx.beginPath();
        fctx.moveTo(bx, top + h * 0.38); fctx.lineTo(bx, top + h * 0.72);
        fctx.stroke();
      }
      fctx.globalAlpha = 1;
      // 顶部高光
      fctx.fillStyle = light;
      fctx.fillRect(cx - w / 2, top, w, 3);
      // 描边
      fctx.strokeStyle = dark; fctx.lineWidth = 2.5;
      fctx.strokeRect(cx - w / 2, top, w, h);

      // 墙垛（朝向战场一侧）
      fctx.fillStyle = fill; fctx.lineWidth = 2.5;
      for (var x = cx - w / 2 + 6; x < cx + w / 2 - 6; x += 16) {
        var merY = ally ? top + h : top - 8;
        fctx.fillRect(x, merY, 9, 8);
        fctx.strokeRect(x, merY, 9, 8);
      }
      // 城门（朝向战场，深色木门 + 门环）
      fctx.fillStyle = '#4a3018';
      var doorY = ally ? top : top + h - 12;
      fctx.fillRect(cx - 9, doorY, 18, 12);
      fctx.strokeStyle = '#2c1c0c'; fctx.lineWidth = 1.4;
      fctx.strokeRect(cx - 9, doorY, 18, 12);
      fctx.fillStyle = '#d8b25a';
      fctx.beginPath(); fctx.arc(cx + 5, doorY + 6, 1.6, 0, Math.PI * 2); fctx.fill();

      // 旗（旗杆 + 三角旗，带微风飘动感）
      fctx.strokeStyle = '#1f2d20'; fctx.lineWidth = 2;
      var flagPoleX = cx + w / 2 - 12;
      fctx.beginPath();
      fctx.moveTo(flagPoleX, ally ? top + 4 : top + h - 4);
      fctx.lineTo(flagPoleX, ally ? top - 14 : top + h + 14);
      fctx.stroke();
      fctx.fillStyle = fill; fctx.strokeStyle = dark; fctx.lineWidth = 1.6;
      var fy = ally ? top - 24 : top + h + 4;
      fctx.beginPath();
      fctx.moveTo(flagPoleX, fy); fctx.lineTo(flagPoleX + 13, fy + 5); fctx.lineTo(flagPoleX, fy + 10);
      fctx.closePath(); fctx.fill(); fctx.stroke();

      // 血条（在城堡前方）
      var bw = 130, bxx = cx - bw / 2;
      var barY = ally ? top - 12 : top + h + 6;
      fctx.fillStyle = '#1f2d20';
      fctx.fillRect(bxx - 2, barY - 2, bw + 4, 9);
      fctx.fillStyle = fill;
      fctx.fillRect(bxx, barY, bw * Math.max(0, b.hp / b.maxHp), 5);
    }

    function drawUnit(u) {
      var def = UNITS[u.type];
      var ally = u.side === 'ally';
      var fy = ally ? 1 : -1;   // 武器朝向：蓝方朝上、红方朝下，身体一律直立
      var body = ally ? '#3a78c2' : '#d05040';
      var bodyDark = ally ? '#274c72' : '#8e2f24';
      var skin = '#f0c8a0', skinDark = '#a9784a';
      var metal = '#d6d6ce', metalDark = '#7a7a72';
      var wood = '#8a6a3a', woodDark = '#5a3e20';
      var big = u.type === 'catapult';
      var bob = Math.sin(u.walk) * 1.1;
      var sw = u.atkAnim > 0 ? 1 : 0;   // 是否处于攻击帧

      fctx.save();
      fctx.translate(u.x, u.y + bob);

      // 阴影
      fctx.fillStyle = 'rgba(31,45,32,.22)';
      fctx.beginPath();
      fctx.ellipse(0, big ? 11 : 9, big ? 13 : 8, 3.4, 0, 0, Math.PI * 2);
      fctx.fill();

      if (big) {
        // ===== 投石车：木架车身 + 横梁 + 投掷臂 + 辐条轮 =====
        fctx.fillStyle = wood; fctx.strokeStyle = woodDark; fctx.lineWidth = 2;
        roundRect(fctx, -12, -3, 24, 9, 2); fctx.fill(); fctx.stroke();
        fctx.fillStyle = woodDark; fctx.fillRect(-12, -3, 24, 2);   // 上横梁
        var armAng = sw ? -1.15 : 0.15;
        fctx.strokeStyle = woodDark; fctx.lineWidth = 3;
        fctx.beginPath();
        fctx.moveTo(0, 0);
        fctx.lineTo(Math.cos(armAng) * 16, fy * Math.sin(armAng) * 16 - 2);
        fctx.stroke();
        // 臂端石兜与石头
        fctx.fillStyle = '#4a4a44';
        fctx.beginPath();
        fctx.arc(Math.cos(armAng) * 16, fy * Math.sin(armAng) * 16 - 4, 2.6, 0, Math.PI * 2);
        fctx.fill();
        // 两个辐条轮
        fctx.fillStyle = woodDark;
        fctx.beginPath(); fctx.arc(-7, 7, 4, 0, Math.PI * 2); fctx.arc(8, 7, 4, 0, Math.PI * 2); fctx.fill();
        fctx.strokeStyle = wood; fctx.lineWidth = 1.4;
        fctx.beginPath(); fctx.arc(-7, 7, 4, 0, Math.PI * 2); fctx.stroke();
        fctx.beginPath(); fctx.arc(8, 7, 4, 0, Math.PI * 2); fctx.stroke();
      } else {
        // ===== 人形兵种 =====
        // 小腿（踏步）
        fctx.strokeStyle = bodyDark; fctx.lineWidth = 2.4;
        var step = Math.sin(u.walk * 1.5) * 1.5;
        fctx.beginPath();
        fctx.moveTo(-3, 5); fctx.lineTo(-3 - step, 9);
        fctx.moveTo(3, 5); fctx.lineTo(3 + step, 9);
        fctx.stroke();
        // 战甲身体
        fctx.fillStyle = body; fctx.strokeStyle = bodyDark; fctx.lineWidth = 2;
        roundRect(fctx, -6, -4, 12, 10, 3); fctx.fill(); fctx.stroke();
        fctx.fillStyle = bodyDark; fctx.fillRect(-6, 1, 12, 1.6);   // 腰带
        // 头
        fctx.fillStyle = skin; fctx.strokeStyle = skinDark; fctx.lineWidth = 1.6;
        fctx.beginPath(); fctx.arc(0, -8, 4.4, 0, Math.PI * 2); fctx.fill(); fctx.stroke();

        // ---- 头盔 / 帽子（兵种区分）----
        if (u.type === 'swordsman') {
          // 铁盔
          fctx.fillStyle = metal; fctx.strokeStyle = metalDark; fctx.lineWidth = 1.4;
          fctx.beginPath(); fctx.arc(0, -9, 4.4, Math.PI, 0); fctx.fill(); fctx.stroke();
          fctx.fillRect(-4.4, -9, 8.8, 1.4);
        } else if (u.type === 'spearman') {
          // 小盔 + 红缨
          fctx.fillStyle = metal; fctx.strokeStyle = metalDark; fctx.lineWidth = 1.4;
          fctx.beginPath(); fctx.arc(0, -9, 4.2, Math.PI, 0); fctx.fill(); fctx.stroke();
          fctx.strokeStyle = '#c23a2a'; fctx.lineWidth = 1.6;
          fctx.beginPath(); fctx.moveTo(0, -13); fctx.lineTo(0, -16.5); fctx.stroke();
        } else if (u.type === 'archer') {
          // 兜帽
          fctx.fillStyle = bodyDark;
          fctx.beginPath(); fctx.moveTo(-5, -8); fctx.lineTo(0, -15); fctx.lineTo(5, -8); fctx.closePath(); fctx.fill();
        } else if (u.type === 'mage') {
          // 尖顶帽 + 宽檐
          fctx.fillStyle = '#6a427a'; fctx.strokeStyle = '#472c54'; fctx.lineWidth = 1.4;
          fctx.fillRect(-5.5, -9.6, 11, 1.8);
          fctx.beginPath(); fctx.moveTo(-4.5, -9); fctx.lineTo(0, -18); fctx.lineTo(4.5, -9); fctx.closePath(); fctx.fill(); fctx.stroke();
        }

        // ---- 武器：随阵营上下镜像，人不倒立 ----
        fctx.save(); fctx.scale(1, fy);
        if (u.type === 'swordsman') {
          var bladeAng = sw ? -1.0 : -0.25;
          fctx.save(); fctx.translate(5, 0); fctx.rotate(bladeAng);
          fctx.strokeStyle = metal; fctx.lineWidth = 2.6;
          fctx.beginPath(); fctx.moveTo(0, 0); fctx.lineTo(0, -11); fctx.stroke();
          fctx.strokeStyle = woodDark; fctx.lineWidth = 2;
          fctx.beginPath(); fctx.moveTo(-2.6, 0); fctx.lineTo(2.6, 0); fctx.stroke();
          fctx.restore();
          if (sw) {
            fctx.strokeStyle = 'rgba(255,255,255,.7)'; fctx.lineWidth = 1.6;
            fctx.beginPath(); fctx.arc(6, -2, 9, -0.6, 0.9); fctx.stroke();
          }
        } else if (u.type === 'spearman') {
          var px = sw ? 3 : 0;
          fctx.strokeStyle = wood; fctx.lineWidth = 1.8;
          fctx.beginPath(); fctx.moveTo(-4, 8); fctx.lineTo(10 + px, -12); fctx.stroke();
          fctx.fillStyle = metal;
          fctx.beginPath(); fctx.moveTo(10 + px, -12); fctx.lineTo(13 + px, -15.5); fctx.lineTo(12 + px, -10.5); fctx.closePath(); fctx.fill();
        } else if (u.type === 'archer') {
          fctx.strokeStyle = woodDark; fctx.lineWidth = 2;
          fctx.beginPath(); fctx.arc(7, -1, 6, -1.2, 1.2); fctx.stroke();
          var pull = sw ? 3 : 0;
          fctx.strokeStyle = '#e8e8e0'; fctx.lineWidth = 1.2;
          fctx.beginPath();
          fctx.moveTo(7 + Math.cos(-1.2) * 6, -1 + Math.sin(-1.2) * 6);
          fctx.lineTo(7 - pull, -1);
          fctx.lineTo(7 + Math.cos(1.2) * 6, -1 + Math.sin(1.2) * 6);
          fctx.stroke();
          if (sw) {
            fctx.strokeStyle = metal; fctx.lineWidth = 1.4;
            fctx.beginPath(); fctx.moveTo(2, -1); fctx.lineTo(11, -1); fctx.stroke();
          }
        } else if (u.type === 'mage') {
          fctx.strokeStyle = woodDark; fctx.lineWidth = 2;
          fctx.beginPath(); fctx.moveTo(6, 6); fctx.lineTo(9, -9); fctx.stroke();
          fctx.fillStyle = sw ? '#e6bcff' : '#c79ae0';
          fctx.beginPath(); fctx.arc(9, -10, sw ? 3.3 : 2.4, 0, Math.PI * 2); fctx.fill();
          if (sw) {
            fctx.strokeStyle = 'rgba(199,154,224,.6)'; fctx.lineWidth = 1.4;
            fctx.beginPath(); fctx.arc(9, -10, 5, 0, Math.PI * 2); fctx.stroke();
          }
        }
        fctx.restore();
      }

      // 燃烧火苗（橙红小像素火，随步伐闪动，不刺眼）
      if (u.burnT > 0) {
        var fl = Math.sin(u.walk * 4) * 1.2;
        fctx.fillStyle = '#e8722a';
        fctx.beginPath();
        fctx.moveTo(-2.5, -12 + fl); fctx.lineTo(0, -18 - fl); fctx.lineTo(2.5, -12 + fl);
        fctx.closePath(); fctx.fill();
        fctx.fillStyle = '#f5c04a';
        fctx.beginPath();
        fctx.moveTo(-1.2, -12 + fl * 0.6); fctx.lineTo(0, -15.5 - fl * 0.6); fctx.lineTo(1.2, -12 + fl * 0.6);
        fctx.closePath(); fctx.fill();
      }

      fctx.restore();

      // 血条（头顶）
      if (!big && u.hp < u.maxHp) {
        var w2 = 16;
        fctx.fillStyle = '#1f2d20';
        fctx.fillRect(u.x - w2 / 2 - 1, u.y - 17, w2 + 2, 4);
        fctx.fillStyle = u.hp / u.maxHp > 0.4 ? '#5a8f3c' : '#e2503d';
        fctx.fillRect(u.x - w2 / 2, u.y - 16, w2 * Math.max(0, u.hp / u.maxHp), 2);
      }
    }

    function drawTower(t) {
      var ally = t.side === 'ally';
      var fill = ally ? '#3a78c2' : '#d05040';
      var dark = ally ? '#274c72' : '#8e2f24';
      var light = ally ? '#5a96d6' : '#e06a58';
      var x = t.x, y = t.y;
      // 阴影
      fctx.fillStyle = 'rgba(31,45,32,.22)';
      fctx.beginPath(); fctx.ellipse(x, y + 18, 15, 4, 0, 0, Math.PI * 2); fctx.fill();
      // 石底座（含灰缝）
      fctx.fillStyle = '#9aa1a8'; fctx.strokeStyle = '#565c64'; fctx.lineWidth = 2.5;
      fctx.fillRect(x - 13, y + 10, 26, 7); fctx.strokeRect(x - 13, y + 10, 26, 7);
      fctx.strokeStyle = 'rgba(86,92,100,.6)'; fctx.lineWidth = 1;
      fctx.beginPath(); fctx.moveTo(x - 13, y + 13.5); fctx.lineTo(x + 13, y + 13.5); fctx.stroke();
      // 塔身
      fctx.fillStyle = fill; fctx.strokeStyle = dark; fctx.lineWidth = 2.5;
      fctx.fillRect(x - 9, y - 12, 18, 22); fctx.strokeRect(x - 9, y - 12, 18, 22);
      // 塔身砖缝
      fctx.strokeStyle = dark; fctx.globalAlpha = 0.3; fctx.lineWidth = 1;
      fctx.beginPath();
      fctx.moveTo(x - 9, y - 5); fctx.lineTo(x + 9, y - 5);
      fctx.moveTo(x - 9, y + 2); fctx.lineTo(x + 9, y + 2);
      fctx.stroke();
      fctx.globalAlpha = 1;
      // 左侧受光亮面
      fctx.fillStyle = light; fctx.globalAlpha = 0.5;
      fctx.fillRect(x - 9, y - 12, 3, 22);
      fctx.globalAlpha = 1;
      // 顶部垛口
      fctx.lineWidth = 2;
      fctx.fillRect(x - 9, y - 17, 6, 5); fctx.strokeRect(x - 9, y - 17, 6, 5);
      fctx.fillRect(x - 3, y - 17, 6, 5); fctx.strokeRect(x - 3, y - 17, 6, 5);
      fctx.fillRect(x + 3, y - 17, 6, 5); fctx.strokeRect(x + 3, y - 17, 6, 5);
      // 射箭孔（窄竖缝，深色）
      fctx.fillStyle = dark;
      fctx.fillRect(x - 1.5, y - 6, 3, 9);
      // 旗杆与三角旗
      fctx.strokeStyle = '#1f2d20'; fctx.lineWidth = 1.6;
      fctx.beginPath(); fctx.moveTo(x, y - 17); fctx.lineTo(x, y - 27); fctx.stroke();
      fctx.fillStyle = fill; fctx.strokeStyle = dark; fctx.lineWidth = 1.2;
      fctx.beginPath();
      fctx.moveTo(x, y - 27); fctx.lineTo(x + 9, y - 24); fctx.lineTo(x, y - 21);
      fctx.closePath(); fctx.fill(); fctx.stroke();
      // 血条（底座下方）
      var bw = 24;
      fctx.fillStyle = '#1f2d20';
      fctx.fillRect(x - bw / 2 - 1, y + 19, bw + 2, 5);
      fctx.fillStyle = t.hp / t.maxHp > 0.4 ? fill : '#e2503d';
      fctx.fillRect(x - bw / 2, y + 20, bw * Math.max(0, t.hp / t.maxHp), 3);
    }

    function drawProjectile(p) {
      fctx.save();
      if (p.kind === 'archer') {
        var ang = Math.atan2(p.ty - p.y, p.tx - p.x);
        fctx.translate(p.x, p.y); fctx.rotate(ang);
        fctx.strokeStyle = '#6a4a28'; fctx.lineWidth = 2;
        fctx.beginPath(); fctx.moveTo(-5, 0); fctx.lineTo(4, 0); fctx.stroke();
        fctx.strokeStyle = '#d8d8d0'; fctx.lineWidth = 1.6;
        fctx.beginPath(); fctx.moveTo(4, 0); fctx.lineTo(8, 0); fctx.stroke();
      } else if (p.kind === 'mage') {
        fctx.fillStyle = p.color;
        fctx.beginPath(); fctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); fctx.fill();
        fctx.globalAlpha = .4; fctx.beginPath(); fctx.arc(p.x, p.y, 7, 0, Math.PI * 2); fctx.fill();
      } else {
        fctx.fillStyle = '#5a5a52';
        fctx.beginPath(); fctx.arc(p.x, p.y, 4, 0, Math.PI * 2); fctx.fill();
      }
      fctx.restore();
    }

    function drawHit(h) {
      var p = h.t / 0.28;
      fctx.save();
      fctx.globalAlpha = 1 - p;
      fctx.strokeStyle = h.color;
      fctx.lineWidth = 2;
      fctx.beginPath();
      fctx.arc(h.x, h.y, h.size * (0.4 + p), 0, Math.PI * 2);
      fctx.stroke();
      fctx.restore();
    }

    function showResult(win) {
      var mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.innerHTML =
        '<div class="modal-box" role="dialog" aria-modal="true">' +
          '<h3 class="modal-title">' + (win ? '胜利！' : '基地被攻破') + '</h3>' +
          '<p class="modal-text">' +
            (win ? '你摧毁了红色敌方基地！' : '红色大军攻破了你的蓝色基地。') +
            '<br>本局总得分 ' + G.score + ' 分。</p>' +
          '<button class="pixel-btn" id="battleAgain" type="button">再来一局</button>' +
        '</div>';
      document.body.appendChild(mask);
      mask.querySelector('#battleAgain').addEventListener('click', restart);
    }
    // 奖牌：普通难度通关=铜牌；困难难度通关=银牌；困难累计通关 3 次=金牌
    function earnBattleMedal() {
      var earned = { bronze: false, silver: false, gold: false };
      if (difficulty === 'hard') {
        var hardWins = 0;
        try { hardWins = parseInt(localStorage.getItem('battlematch-hard-wins') || '0', 10) || 0; } catch (e) {}
        hardWins += 1;
        try { localStorage.setItem('battlematch-hard-wins', String(hardWins)); } catch (e) {}
        earned.silver = true;
        if (hardWins >= 3) { earned.gold = true; }
      } else {
        earned.bronze = true;
      }
      return SiteMedals.unlock('battlematch', earned);
    }
    function endGame(win) {
      G.over = true;
      if (!win) { showResult(false); return; }
      var newMedal = earnBattleMedal();
      if (newMedal) {
        showMedalDialog(newMedal, '对战消消乐', function () { showResult(true); });
      } else {
        showResult(true);
      }
    }
    /* ===FIELD_END=== */

    /* ---------- HUD 与购买条 ---------- */
    function updateHud() {
      hudScore.textContent = G.score;
      var pct = Math.max(0, Math.min(100, G.energy / ENERGY_MAX * 100));
      energyFill.style.width = pct + '%';
      hudEnergy.textContent = G.energy + ' / ' + ENERGY_MAX;
      for (var i = 0; i < shopBtns.length; i++) {
        var type = shopBtns[i].getAttribute('data-unit');
        shopBtns[i].classList.toggle('poor', G.energy < UNITS[type].cost);
      }
    }

    function buyUnit(type) {
      if (!G || G.over || G.paused) { return false; }
      var cost = UNITS[type].cost;
      if (G.energy < cost) {
        showToast('能量不足，还差 ' + (cost - G.energy));
        return false;
      }
      G.energy -= cost;
      spawnUnit('ally', type);
      updateHud();
      return true;
    }
    var KEY_UNITS = { Digit1: 'spearman', Digit2: 'archer', Digit3: 'mage', Digit4: 'catapult' };
    for (var bi = 0; bi < shopBtns.length; bi++) {
      shopBtns[bi].addEventListener('click', function () {
        buyUnit(this.getAttribute('data-unit'));
        this.blur();
      });
    }

    /* ---------- 消消乐输入（鼠标 / 触摸统一用 pointer） ---------- */
    function matchPoint(e) {
      var rect = matchCv.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width * MS;
      var y = (e.clientY - rect.top) / rect.height * MS;
      var c = Math.floor(x / CELL), r = Math.floor(y / CELL);
      if (r >= 0 && r < N && c >= 0 && c < N) { tapCell(r, c); }
    }
    matchCv.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      matchPoint(e);
    });

    /* ---------- 空格键暂停 / 继续 ---------- */
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea') { return; }
      if (restartConfirmOpen) {
        if (e.code === 'Escape') { e.preventDefault(); closeRestartConfirm(false); }
        else if (e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); closeRestartConfirm(true); }
        return;
      }
      if (diffConfirmOpen) {
        if (e.code === 'Escape') { e.preventDefault(); closeDiffConfirm(true); }
        return;
      }
      if (e.code === 'Space' && !e.repeat) {
        if (!G || G.over) { return; }
        e.preventDefault();
        setPaused(!G.paused);
      } else if (e.code === 'KeyR' && !e.repeat) {
        if (!G || G.over || G.paused) { return; }
        e.preventDefault();
        startReshuffle();
      } else if (KEY_UNITS[e.code]) {
        if (!G || G.over || G.paused) { return; }
        e.preventDefault();
        buyUnit(KEY_UNITS[e.code]);
      }
    });
    /* ===MAIN_END=== */

    /* ---------- 重新开始 ---------- */
    function restart() {
      G = newState();
      buildBoard();
      checkDeadBoard();
      updateHud();
      pauseMask.classList.remove('show');
      btnReshuffle.disabled = false;
      refreshDiffButton();
      var mask = document.querySelector('.modal-mask');
      if (mask) { mask.remove(); }
    }
    var restartConfirmOpen = false;
    var confirmWasPaused = false;
    function closeRestartConfirm(go) {
      restartConfirmOpen = false;
      var mask = document.getElementById('restartConfirm');
      if (mask) { mask.remove(); }
      if (go) { restart(); }
      else { setPaused(confirmWasPaused); }
    }
    function askRestart() {
      if (!G || G.over) { restart(); return; }
      if (restartConfirmOpen) { return; }
      restartConfirmOpen = true;
      confirmWasPaused = G.paused;
      G.paused = true;
      pauseMask.classList.remove('show');
      if (btnPause) { btnPause.textContent = '继续'; }
      var mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.id = 'restartConfirm';
      mask.innerHTML =
        '<div class="modal-box" role="dialog" aria-modal="true">' +
          '<h3 class="modal-title">重新开始？</h3>' +
          '<p class="modal-text">当前对局的得分、能量和战场都会清空。</p>' +
          '<div class="restart-actions">' +
            '<button class="pixel-btn secondary" id="restartNo" type="button">否，继续游戏</button>' +
            '<button class="pixel-btn" id="restartYes" type="button">是，重新开始</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(mask);
      document.getElementById('restartYes').addEventListener('click', function () { closeRestartConfirm(true); });
      document.getElementById('restartNo').addEventListener('click', function () { closeRestartConfirm(false); });
    }
    document.getElementById('btnRestart').addEventListener('click', askRestart);
    var diffConfirmOpen = false;
    var diffWasPaused = false;
    function closeDiffConfirm(cancel) {
      diffConfirmOpen = false;
      var mask = document.getElementById('diffConfirm');
      if (mask) { mask.remove(); }
      if (cancel) { setPaused(diffWasPaused); }
    }
    function chooseDifficulty(d) {
      if (!DIFFS[d]) { return; }
      var changed = d !== difficulty;
      difficulty = d;
      try { localStorage.setItem('battlematch-difficulty', d); } catch (e) {}
      refreshDiffButton();
      diffConfirmOpen = false;
      var mask = document.getElementById('diffConfirm');
      if (mask) { mask.remove(); }
      if (changed) { restart(); }
      else { setPaused(diffWasPaused); }
    }
    function askDifficulty() {
      if (!G || G.over || restartConfirmOpen || diffConfirmOpen) { return; }
      diffConfirmOpen = true;
      diffWasPaused = G.paused;
      G.paused = true;
      pauseMask.classList.remove('show');
      if (btnPause) { btnPause.textContent = '继续'; }
      var mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.id = 'diffConfirm';
      var keys = ['normal', 'hard'];
      var rows = '';
      for (var di = 0; di < keys.length; di++) {
        var k = keys[di], dd = DIFFS[k];
        rows += '<button class="pixel-btn diff-row ' + (k === difficulty ? 'current' : 'secondary') + '" data-diff="' + k + '" type="button">' +
                  '<span class="diff-name">' + dd.name + (k === difficulty ? '（当前）' : '') + '</span>' +
                  '<span class="diff-desc">' + dd.desc + '</span>' +
                '</button>';
      }
      mask.innerHTML =
        '<div class="modal-box" role="dialog" aria-modal="true">' +
          '<h3 class="modal-title">选择难度</h3>' +
          '<p class="modal-text">切换到其他难度后，本局将重新开始。</p>' +
          '<div class="diff-list">' + rows + '</div>' +
          '<div class="diff-cancel"><button class="pixel-btn secondary" id="diffCancel" type="button">取消</button></div>' +
        '</div>';
      document.body.appendChild(mask);
      var rowBtns = mask.querySelectorAll('.diff-row');
      for (var ri = 0; ri < rowBtns.length; ri++) {
        rowBtns[ri].addEventListener('click', function () { chooseDifficulty(this.getAttribute('data-diff')); });
      }
      document.getElementById('diffCancel').addEventListener('click', function () { closeDiffConfirm(true); });
    }
    btnDifficulty.addEventListener('click', askDifficulty);
    btnPause.addEventListener('click', function () {
      if (!G || G.over) { return; }
      setPaused(!G.paused);
      this.blur();
    });
    btnReshuffle.addEventListener('click', function () { startReshuffle(); this.blur(); });
    refreshShopCosts();

    restart();
    var lastTs = 0;
    function frame(ts) {
      var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      if (G && !G.over && !G.paused) {
        G.time += dt;
        updateMatch3(dt);
        updateField(dt);
      }
      if (G) {
        drawField();
        drawMatch3();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
